<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIE LCD Simulator (Exact Logic)</title>
    {/* Stylesheets and Fonts */}
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
       .lcd-screen-bg { background-color: #c2f0c2; border: 2px solid #a0d0a0; padding: 5px; border-radius: 4px; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2); width: fit-content; margin-left: auto; margin-right: auto; }
       .lcd-container { display: grid; grid-template-rows: repeat(4, 1fr); width: calc(20 * 18px); height: calc(4 * 30px); gap: 1px; }
       .lcd-row { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; width: 100%; height: 100%; }
       .lcd-char { display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; color: #104010; background-color: rgba(0, 0, 0, 0.02); font-weight: bold; text-transform: uppercase; width: 100%; height: 100%; font-size: 16px; line-height: 1; padding: 0; padding-left: 1px; user-select: none; overflow: hidden; white-space: pre; }
       @keyframes blink { 50% { background-color: rgba(20, 64, 20, 0.2); color: #c2f0c2; } }
       .lcd-char.text-cursor { animation: blink 1s step-end infinite; }
       .editable-field { cursor: pointer; border-bottom: 1px dashed #666; padding: 0 2px; min-width: 40px; display: inline-block; text-align: right;}
       .editable-field:hover { background-color: rgba(0,0,0,0.05); }
       .status-input { padding: 1px 3px; margin: 0; border: 1px solid #999; background-color: white; color: black; font-size: inherit; font-family: inherit; width: 70px; text-align: right; }
       .status-label { font-weight: bold; display: inline-block; width: 110px; }
       .status-unit { margin-left: 4px; color: #555; }
       .autopilot-label { margin-left: 10px; font-size: 0.8rem; color: #333; cursor: pointer; }
       .autopilot-checkbox { vertical-align: middle; }
       .external-controls { margin-top: 1rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; max-width: 400px; }
       .ext-btn { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; transition: background-color 0.2s; }
       .ext-btn-toggle { background-color: #e2e8f0; color: #4a5568; border: 1px solid #cbd5e0; }
       .ext-btn-toggle.active { background-color: #f56565; color: white; border-color: #f56565; }
       .ext-btn-trigger { background-color: #fefcbf; color: #9f7a00; border: 1px solid #fce57d; }
       .ext-btn-clear { background-color: #c6f6d5; color: #2f855a; border: 1px solid #9ae6b4; }
       .ext-btn:hover { opacity: 0.8; }
       .beacon-container { display: flex; justify-content: center; gap: 2rem; margin-bottom: 1.5rem; align-items: center;}
       .beacon { width: 30px; height: 30px; border-radius: 50%; background-color: #ccc; border: 2px solid #aaa; transition: background-color 0.3s, box-shadow 0.3s; position: relative; }
       .beacon.green.active { background-color: #4ade80; border-color: #22c55e; box-shadow: 0 0 10px #4ade80; }
       .beacon.amber.active { background-color: #facc15; border-color: #eab308; box-shadow: 0 0 10px #facc15; }
       .beacon.red.active { background-color: #f87171; border-color: #ef4444; box-shadow: 0 0 10px #f87171; }
       .beacon-label { font-size: 0.75rem; text-align: center; margin-top: 2px; color: #555; font-weight: 500; }
       .alarm-status { font-size: 0.8rem; font-weight: bold; margin-left: 5px; }
       .alarm-status.sounding { color: #ef4444; }
       .alarm-status.muted { color: #a0aec0; }
       @keyframes alarm-blink { 50% { opacity: 0.4; } }
       .beacon.red.sounding { animation: alarm-blink 1s step-end infinite; }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="root"></div>

    {/* React/ReactDOM/Babel Scripts */}
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    {/* React Code */}
    <script type="text/babel">
      "use strict";

      const { useState, useEffect, useRef, useCallback } = React;

      // --- Constants ---
      const INACTIVITY_TIMEOUT_MS = 30000;
      const ALLOWED_CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_!@#$%&*()+✓'.split('');
      const SSID_MAX_LENGTH = 16; const PASSWORD_MIN_LENGTH = 8; const PASSWORD_MAX_LENGTH = 16;
      const LCD_WIDTH = 20; const SCROLL_INTERVAL_MS = 400; const SCROLL_DELAY_MS = 1500; const RESTART_DELAY_MS = 3000;
      const productNames = ["PRO-OXINE", "OXINE", "KEEPER PRO", "KEEPER"];
      const probeNames = ["None", "CLO2", "pH", "ORP", "Other"];
      const productConcentrations = [50000, 20000, 83500, 33350];
      const pins = { user: '1234', tech: '5678', master: '9999' };
      const PROBE_RANGES = [ { low: 0, high: 0 }, { low: 0, high: 10 }, { low: 0, high: 14 }, { low: -1000, high: 1000 }, { low: -500, high: 500 } ];
      const SIMULATED_FIELDS = ['flowRate', 'probeOne', 'probeTwo', 'rawFlowValue', 'rawProbeOneValue', 'rawProbeTwoValue'];
      const EDITABLE_FIELDS = ['flowRate', 'probeOne', 'probeTwo', 'desiredPPM', 'maxFlowRate', 'productAcidRatio', 'pumpWeight'];
      // Error code categories based on ESP32 logic
      const WARNING_ERRORS = ["PUMP_WARNING", "LOW_FLOW", "MISWEIGHTED"];
      const ALARM_ERRORS_STOP_PUMP = ["PUMP_ALARM", "NO_FLOW"];
      const PAUSE_ERROR = "SYSTEM_PAUSED";

      // --- Helper Component: EditableStatusField ---
      const EditableStatusField = ({ label, valueKey, currentValue, units = '', isEditing, onToggleEdit, onSave, isAutopilotEnabled, onToggleAutopilot, step = 1, precision = 1, minVal = -Infinity, maxVal = Infinity }) => {
        const [tempValue, setTempValue] = useState(currentValue); const inputRef = useRef(null);
        useEffect(() => { if (!isEditing) { setTempValue(currentValue); } }, [currentValue, isEditing]);
        useEffect(() => { if (isEditing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [isEditing]);
        const handleSave = () => { const numValue = parseFloat(tempValue); if (!isNaN(numValue)) { const clampedValue = Math.max(minVal, Math.min(maxVal, numValue)); const formattedValue = parseFloat(clampedValue.toFixed(precision)); onSave(valueKey, formattedValue); } else { onToggleEdit(valueKey, false); setTempValue(currentValue); } };
        const handleKeyDown = (e) => { if (e.key === 'Enter') { handleSave(); } else if (e.key === 'Escape') { onToggleEdit(valueKey, false); setTempValue(currentValue); } };
        const handleBlur = () => { handleSave(); };
        return ( <div> <span className="status-label">{label}:</span> {isEditing ? ( <input ref={inputRef} type="number" className="status-input" value={tempValue} onChange={(e) => setTempValue(e.target.value)} onKeyDown={handleKeyDown} onBlur={handleBlur} step={step} min={minVal} max={maxVal} /> ) : ( <span className="editable-field" onClick={() => onToggleEdit(valueKey, true)}> {typeof currentValue === 'number' ? currentValue.toFixed(precision) : currentValue} </span> )} {units && <span className="status-unit">{units}</span>} {SIMULATED_FIELDS.includes(valueKey) && ( <label className="autopilot-label"> <input type="checkbox" className="autopilot-checkbox" checked={isAutopilotEnabled} onChange={() => onToggleAutopilot(valueKey)} /> Auto </label> )} </div> );
      };

      const LCDSimulator = () => {
        // --- State ---
        const [systemState, setSystemState] = useState({
            flowRate: 6.0, probeOne: 7.2, probeTwo: 450, desiredPPM: 5.0, maxFlowRate: 20, productSelection: 0,
            probeOneSelection: 2, probeTwoSelection: 3, productAcidRatio: 5.0, pumpWeight: 1.5, acidStrokeVolume: 0.5,
            totalizedFlowRate: 1234.5, totalizedInjection: 2.345, totalizedAcidInjection: 0.469, dac_4: 800, dac_20: 4000,
            pumpEnabled: false, // Derived from errorCode now
            errorCode: PAUSE_ERROR, // Start paused
            rawFlowValue: 2048, rawProbeOneValue: 1800, rawProbeTwoValue: 2200, minCalibrateFlow: 500, maxCalibrateFlow: 3500,
            probeOneCalLow: 100, probeTwoCalLow: 100, probeOneCalHigh: 900, probeTwoCalHigh: 900,
            probeOneALow: 0.0, probeTwoALow: -1000.0, probeOneAHigh: 14.0, probeTwoAHigh: 1000.0, // Defaults based on initial selection
            serialId: "EM1001", ssid: "EM1001", password: "PASSWORD", apMode: true,
            cfApiTokenSet: true, cfUploadsEnabled: true, cfEmailsEnabled: false, cfConnected: false,
         });
        const [menuState, setMenuState] = useState({
            currentScreen: 'home', selectedItem: 0, editingItem: false, passwordPrompt: false, enteredPassword: '', editingValue: undefined,
            passwordTarget: '', accessLevel: '', menuHistory: [], textInputMode: false, textInputValue: '', textInputCursorPos: 0, textInputCurrentCharIndex: 0,
            textInputTargetKey: null, textInputMaxLength: 32, textInputMinLength: 0, textInputPrompt: '', textInputCallback: null,
            confirmMode: false, confirmPrompt: '', confirmCallback: null, networkEditMode: false, tempApMode: true, tempSsid: '', tempPassword: '',
            editingStatusFields: {}, autopilotEnabled: SIMULATED_FIELDS.reduce((acc, key) => ({ ...acc, [key]: true }), {}),
            isRestarting: false, isAlarmSounding: false, isAlarmMuted: false,
        });
        const [lcdMessage, setLcdMessage] = useState('');
        const [currentTime, setCurrentTime] = useState('--:--:--');
        const [runTimeString, setRunTimeString] = useState('Calculating...');
        const [fullLines, setFullLines] = useState(["", "", "", ""]);
        const [scrollPositions, setScrollPositions] = useState([0, 0, 0, 0]);
        const scrollTimeoutRef = useRef(null); const scrollIntervalRef = useRef(null);
        const messageTimeoutRef = useRef(null); const inactivityTimeoutRef = useRef(null);
        const bootTimeRef = useRef(Date.now());

        // --- Helpers ---
        const checkPin = (pin) => { if (pin === pins.master) return 'master'; if (pin === pins.tech) return 'tech'; if (pin === pins.user) return 'user'; return ''; };
        const currentMaOutput = () => { const conc = productConcentrations[systemState.productSelection]; if (conc === 0) return 'Div/0'; const gph = (systemState.flowRate * systemState.desiredPPM * 60.0) / conc; let targetMa = 4.0; if (systemState.pumpEnabled && systemState.flowRate > 0.04) { targetMa = 4.0 + (16.0 * gph / systemState.pumpWeight); targetMa = Math.min(20.0, Math.max(4.0, targetMa)); } else if (!systemState.pumpEnabled) { targetMa = 4.0; } return targetMa.toFixed(2); };
        const acidMaOutput = () => { const conc = productConcentrations[systemState.productSelection]; if (conc === 0 || systemState.productAcidRatio === 0) return 'Div/0'; const pGph = (systemState.flowRate * systemState.desiredPPM * 60.0) / conc; const aGph = pGph / systemState.productAcidRatio; let targetMa = 4.0; if (systemState.pumpEnabled && systemState.flowRate > 0.04) { targetMa = 4.0 + (16.0 * aGph / systemState.pumpWeight); targetMa = Math.min(20.0, Math.max(4.0, targetMa)); } else if (!systemState.pumpEnabled) { targetMa = 4.0; } return targetMa.toFixed(2); };
        const displayMessageOnLCD = useCallback((message, duration = 1500) => { if (messageTimeoutRef.current) clearTimeout(messageTimeoutRef.current); setLcdMessage(message); messageTimeoutRef.current = setTimeout(() => { setLcdMessage(''); messageTimeoutRef.current = null; }, duration); }, []);
        const formatRuntime = (ms) => { const totalSeconds = Math.floor(ms / 1000); const minutes = Math.floor(totalSeconds / 60) % 60; const hours = Math.floor(totalSeconds / 3600) % 24; const days = Math.floor(totalSeconds / 86400); if (days > 0) return `RT:${String(days).padStart(2,'0')}d${String(hours).padStart(2,'0')}h`; else return `RT:${String(hours).padStart(2,'0')}h${String(minutes).padStart(2,'0')}m`; };

        // --- Effect to Set Pump State based on Error Code ---
        useEffect(() => {
            const { errorCode } = systemState;
            let shouldBeEnabled = false;
            if (errorCode === "NO_ERROR" || WARNING_ERRORS.includes(errorCode)) {
                shouldBeEnabled = true;
            } // Alarm errors and Pause keep pump disabled
            if (systemState.pumpEnabled !== shouldBeEnabled) {
                 setSystemState(prev => ({ ...prev, pumpEnabled: shouldBeEnabled }));
                 console.log(`Pump state set to ${shouldBeEnabled} due to error code ${errorCode}`);
            }
        }, [systemState.errorCode]);

        // --- Beacon & Alarm Logic ---
        const getBeaconStates = useCallback(() => { const { errorCode, pumpEnabled } = systemState; let states = { green: false, amber: false, red: false }; if (errorCode === "NO_ERROR" && pumpEnabled) { states.green = true; } else if (WARNING_ERRORS.includes(errorCode)) { states.amber = true; } else if (ALARM_ERRORS_STOP_PUMP.includes(errorCode) || errorCode === PAUSE_ERROR) { states.red = true; } return states; }, [systemState.errorCode, systemState.pumpEnabled]);
        useEffect(() => { const bStates = getBeaconStates(); if (bStates.red && !menuState.isAlarmMuted) { if (!menuState.isAlarmSounding) { setMenuState(prev => ({ ...prev, isAlarmSounding: true })); } } else { if (menuState.isAlarmSounding) { setMenuState(prev => ({ ...prev, isAlarmSounding: false })); } } }, [getBeaconStates, menuState.isAlarmMuted]);

        // --- Inactivity Timeout Logic ---
        const navigateHomeDueToInactivity = useCallback(() => { console.log("Inactivity timeout..."); setLcdMessage(''); if (messageTimeoutRef.current) clearTimeout(messageTimeoutRef.current); setMenuState(prev => ({ ...prev, currentScreen: 'home', selectedItem: 0, editingItem: false, passwordPrompt: false, enteredPassword: '', editingValue: undefined, passwordTarget: '', menuHistory: [], textInputMode: false, textInputValue: '', confirmMode: false, networkEditMode: false, editingStatusFields: {}, isRestarting: false })); }, []);
        const resetInactivityTimer = useCallback(() => { if (inactivityTimeoutRef.current) clearTimeout(inactivityTimeoutRef.current); if (menuState.currentScreen !== 'home' && !menuState.isRestarting) { inactivityTimeoutRef.current = setTimeout( navigateHomeDueToInactivity, INACTIVITY_TIMEOUT_MS ); } }, [menuState.currentScreen, menuState.isRestarting, navigateHomeDueToInactivity]);
        useEffect(() => { resetInactivityTimer(); return () => { if (inactivityTimeoutRef.current) clearTimeout(inactivityTimeoutRef.current); }; }, [menuState.currentScreen, menuState.editingItem, menuState.passwordPrompt, menuState.textInputMode, menuState.confirmMode, menuState.editingStatusFields, menuState.isRestarting, resetInactivityTimer]);
        useEffect(() => { return () => { if (messageTimeoutRef.current) clearTimeout(messageTimeoutRef.current); }; }, []);

        // --- Simulate Time / Runtime Update ---
        useEffect(() => { let timeInterval = null; const updateTimeDisplay = () => { if (!systemState.apMode && Math.random() > 0.1) { const now = new Date(); const timeString = now.toTimeString().split(' ')[0]; setCurrentTime(timeString); setRunTimeString(''); } else { setCurrentTime('--:--:--'); const elapsedMs = Date.now() - bootTimeRef.current; setRunTimeString(formatRuntime(elapsedMs)); } }; updateTimeDisplay(); timeInterval = setInterval(updateTimeDisplay, 1000); return () => { if (timeInterval) clearInterval(timeInterval); }; }, [systemState.apMode]);

        // --- Navigation Functions ---
        const navigateToMenu = useCallback((menuName) => { const currentScreen = menuState.currentScreen; console.log(`Navigating from ${currentScreen} to ${menuName}`); setMenuState(prev => ({ ...prev, editingItem: false, editingValue: undefined, passwordPrompt: menuName === 'passwordPrompt', textInputMode: menuName === 'textInputScreen', confirmMode: menuName === 'confirmScreen', networkEditMode: menuName === 'networkSettings' ? prev.networkEditMode : false, textInputValue: '', textInputCursorPos: 0, textInputCallback: null, confirmPrompt: '', confirmCallback: null, currentScreen: menuName, selectedItem: 0, menuHistory: [...prev.menuHistory, currentScreen], editingStatusFields: {}, isRestarting: false })); }, [menuState.currentScreen]);
        const navigateBack = useCallback((cancelled = false) => { if (menuState.isRestarting) return; const currentScreen = menuState.currentScreen; let suppressMessage = cancelled; if (currentScreen === 'passwordPrompt') { if (menuState.editingValue !== undefined) { setMenuState(prev => ({ ...prev, editingValue: undefined })); return; } if (menuState.enteredPassword.length > 0) { setMenuState(prev => ({ ...prev, enteredPassword: prev.enteredPassword.slice(0, -1) })); return; } if (!suppressMessage) displayMessageOnLCD("PIN Entry Cancelled"); suppressMessage = true; } else if (menuState.editingItem && currentScreen !== 'networkSettings') { const menu = menus[currentScreen]; if (menu && menu.onExit) { const result = menu.onExit(true); if (result === null) return; } setMenuState(prev => ({ ...prev, editingItem: false, editingValue: undefined })); if (!suppressMessage) displayMessageOnLCD("Edit Cancelled"); return; } else if (menuState.networkEditMode) { setMenuState(prev => ({...prev, networkEditMode: false, tempApMode: systemState.apMode, tempSsid: systemState.ssid, tempPassword: systemState.password})); if (!suppressMessage) displayMessageOnLCD("Changes Discarded"); suppressMessage = true; return; } else if (menuState.textInputMode) { const history = [...menuState.menuHistory]; history.pop(); const returnScreen = history.pop() || 'home'; setMenuState(prev => ({...prev, textInputMode: false, textInputValue: '', currentScreen: returnScreen, menuHistory: history, editingStatusFields: {} })); if (!suppressMessage) displayMessageOnLCD("Input Cancelled"); suppressMessage = true; } else if (menuState.confirmMode) { const history = [...menuState.menuHistory]; history.pop(); const returnScreen = history.pop() || 'home'; setMenuState(prev => ({...prev, confirmMode: false, confirmPrompt: '', confirmCallback: null, currentScreen: returnScreen, menuHistory: history, editingStatusFields: {} })); if (!suppressMessage) displayMessageOnLCD("Action Cancelled"); suppressMessage = true; } if (menuState.menuHistory.length === 0) { if (currentScreen !== 'home') { navigateToMenu('home'); } return; } const history = [...menuState.menuHistory]; const prevMenu = history.pop(); setMenuState(prev => ({ ...prev, currentScreen: prevMenu, selectedItem: 0, editingItem: false, editingValue: undefined, passwordPrompt: false, textInputMode: false, confirmMode: false, networkEditMode: false, menuHistory: history, editingStatusFields: {}, isRestarting: false })); }, [menuState, menus, navigateToMenu, displayMessageOnLCD, systemState]);
        const requestPassword = useCallback((targetMenu) => { const currentScreen = menuState.currentScreen; setMenuState(prev => ({ ...prev, passwordTarget: targetMenu, currentScreen: 'passwordPrompt', enteredPassword: '', editingValue: undefined, passwordPrompt: true, menuHistory: [...prev.menuHistory, currentScreen] })); }, [menuState.currentScreen]);
        const startTextInput = useCallback((targetKey, prompt, initialValue = '', minLength = 0, maxLength = 32, onSaveCallback = null) => { const currentScreen = menuState.currentScreen; const initialChar = initialValue ? initialValue[0] : 'A'; const initialCharIndex = ALLOWED_CHARS.indexOf(initialChar); setMenuState(prev => ({ ...prev, currentScreen: 'textInputScreen', textInputMode: true, textInputValue: initialValue, textInputCursorPos: initialValue.length, textInputCurrentCharIndex: Math.max(0, initialCharIndex), textInputTargetKey: targetKey, textInputMaxLength: maxLength, textInputMinLength: minLength, textInputPrompt: prompt, textInputCallback: onSaveCallback, menuHistory: [...prev.menuHistory, currentScreen] })); }, [menuState.currentScreen]);
        const startConfirmation = useCallback((prompt, onConfirmCallback) => { const currentScreen = menuState.currentScreen; setMenuState(prev => ({ ...prev, currentScreen: 'confirmScreen', confirmMode: true, confirmPrompt: prompt, confirmCallback: onConfirmCallback, selectedItem: 1, menuHistory: [...prev.menuHistory, currentScreen] })); }, [menuState.currentScreen]);

        // --- Simulation Controls ---
        const handleTogglePause = useCallback(() => { setSystemState(prev => ({ ...prev, errorCode: prev.errorCode === PAUSE_ERROR ? "NO_ERROR" : PAUSE_ERROR })); displayMessageOnLCD(systemState.errorCode === PAUSE_ERROR ? "System Resumed" : "System Paused"); }, [systemState.errorCode]);
        const handleTriggerError = useCallback((errorCodeToTrigger) => { if (systemState.errorCode === PAUSE_ERROR) { displayMessageOnLCD("Clear Pause First"); return; } displayMessageOnLCD(`${errorCodeToTrigger} Triggered`); setSystemState(prev => ({ ...prev, errorCode: errorCodeToTrigger })); }, [systemState.errorCode]);
        const handleClearExternalErrors = useCallback(() => { if (systemState.errorCode === PAUSE_ERROR) { displayMessageOnLCD("Clear Pause First"); return; } if (systemState.errorCode !== "NO_ERROR") { displayMessageOnLCD("Errors Cleared"); setSystemState(prev => ({ ...prev, errorCode: "NO_ERROR" })); } else { displayMessageOnLCD("No Errors Active"); } }, [systemState.errorCode]);
        const simulateRestart = useCallback(() => { console.log("Simulating restart..."); setLcdMessage("Restarting..."); setMenuState(prev => ({ ...prev, isRestarting: true })); setTimeout(() => { console.log("Restart complete."); setLcdMessage(''); setMenuState(prev => ({ ...prev, currentScreen: 'home', selectedItem: 0, editingItem: false, passwordPrompt: false, enteredPassword: '', editingValue: undefined, passwordTarget: '', accessLevel: '', menuHistory: [], textInputMode: false, confirmMode: false, networkEditMode: false, editingStatusFields: {}, isRestarting: false, isAlarmMuted: false })); }, RESTART_DELAY_MS); }, []);

        // --- Menu Definitions ---
        const menus = {
            home: {
                title: "EDIE Controller",
                render: (mState, sState) => {
                    const runStatus = sState.pumpEnabled ? "RUN" : "OFF";
                    const line1 = `${sState.serialId} ${runStatus}`;

                    const timeStr = currentTime !== '--:--:--' ? currentTime : runTimeString;
                    const line2 = `${sState.flowRate.toFixed(1)} GPM ${timeStr}`;

                    let line3 = "";
                    if (sState.probeOneSelection > 0) {
                        line3 = `P1(${probeNames[sState.probeOneSelection]}): ${sState.probeOne.toFixed(1)}`;
                    }

                    let line4 = "";
                    if (sState.errorCode !== "NO_ERROR") {
                        let errorPrefix = "";
                        if (ALARM_ERRORS_STOP_PUMP.includes(sState.errorCode)) errorPrefix = "ALARM: ";
                        else if (WARNING_ERRORS.includes(sState.errorCode)) errorPrefix = "WARN: ";
                        else if (sState.errorCode === PAUSE_ERROR) errorPrefix = "";
                        line4 = `${errorPrefix}${sState.errorCode.replace(/_/g, ' ')}`;
                    } else if (sState.probeTwoSelection > 0) {
                        line4 = `P2(${probeNames[sState.probeTwoSelection]}): ${sState.probeTwo.toFixed(1)}`;
                    }
                    // Return raw strings, padding/scrolling handled later
                    return [line1, line2, line3, line4];
                 },
                onEnter: () => navigateToMenu('mainMenu')
            },
            mainMenu: { title: "Main Menu", items: ["Status", "Settings", "Calibration", "System Info"], onSelect: (index) => { switch(index) { case 0: return navigateToMenu('statusMenu'); case 1: if (['user','tech','master'].includes(menuState.accessLevel)) return navigateToMenu('settingsMenu'); requestPassword('settingsMenu'); return null; case 2: if (['tech','master'].includes(menuState.accessLevel)) return navigateToMenu('calibrationMenu'); displayMessageOnLCD("Tech/Master Access"); requestPassword('calibrationMenu'); return null; case 3: return navigateToMenu('systemInfoMenu'); } } },
            statusMenu: { title: "Status Menu", items: ["Flow & PPM", "Pump Outputs", "Probe Readings", "Totals", "Errors"], onSelect: (index) => { switch(index) { case 0: return navigateToMenu('flowStatus'); case 1: return navigateToMenu('pumpStatus'); case 2: return navigateToMenu('probeStatus'); case 3: return navigateToMenu('totalStatus'); case 4: return navigateToMenu('errorStatus'); } } },
            flowStatus: { title: "Flow & PPM Status", render: (mState, sState) => [ `Flow: ${sState.flowRate.toFixed(1)} GPM`, `Desired: ${sState.desiredPPM.toFixed(1)} PPM`, `Max Flow: ${sState.maxFlowRate} GPM`, `Raw Flow Val: ${sState.rawFlowValue}` ], onExit: () => navigateBack() },
            pumpStatus: { title: "Pump Output Status", render: (mState, sState) => [ `Product: ${productNames[sState.productSelection] || 'N/A'}`, `Product Out: ${currentMaOutput()} mA`, `Acid Ratio: 1:${sState.productAcidRatio.toFixed(1)}`, `Acid Output: ${acidMaOutput()} mA` ], onExit: () => navigateBack() },

                    <EditableStatusField label="Raw Probe 1" valueKey="rawProbeOneValue" currentValue={systemState.rawProbeOneValue} units="" precision={0} step={10} minVal={0} maxVal={4095} isEditing={!!menuState.editingStatusFields.rawProbeOneValue} onToggleEdit={handleToggleEditStatus} onSave={handleSaveStatusEdit} isAutopilotEnabled={!!menuState.autopilotEnabled.rawProbeOneValue} onToggleAutopilot={handleToggleAutopilot} />
                   <EditableStatusField label="Raw Probe 2" valueKey="rawProbeTwoValue" currentValue={systemState.rawProbeTwoValue} units="" precision={0} step={10} minVal={0} maxVal={4095} isEditing={!!menuState.editingStatusFields.rawProbeTwoValue} onToggleEdit={handleToggleEditStatus} onSave={handleSaveStatusEdit} isAutopilotEnabled={!!menuState.autopilotEnabled.rawProbeTwoValue} onToggleAutopilot={handleToggleAutopilot} />
                   <div className="col-span-1 md:col-span-2 pt-2 mt-2 border-t"><strong>Access Level:</strong> <span className="font-semibold">{menuState.accessLevel || "None"}</span></div>
                </div>
              </div>
              {/* Tips Section */}
              <div className="mt-6 bg-blue-50 p-3 sm:p-4 rounded-lg w-full max-w-3xl text-xs sm:text-sm shadow-sm border border-blue-200">
                <h3 className="font-bold text-blue-800 mb-1">Simulator Tips:</h3>
                <ul className="list-disc list-inside space-y-1 text-blue-700">
                    <li>Lines longer than 20 chars scroll. Home screen layout revised.</li>
                    <li>External controls simulate Pause Switch and Alarm/Warning inputs. Mute silences Red Beacon.</li>
                    <li>Pump RUN/OFF status is now based *only* on Error Code (Warnings allow run, Alarms/Pause stop).</li>
                    <li>Click 'System Status' values to edit; Use 'Auto' checkboxes for random simulation.</li>
                    <li>LCD menus are locked when Pump is RUNNING (Pause System first).</li>
                    <li>Network settings: changing mode requires restart (simulated).</li>
                    <li>PINs: User: <code>1234</code>, Tech: <code>5678</code>, Master: <code>9999</code>.</li>
                    <li>Returns to Home after {INACTIVITY_TIMEOUT_MS / 1000}s inactivity in menus.</li>
                </ul>
              </div>
              <div className="h-8"></div>
            </div>
          );
      };

      ReactDOM.render(React.createElement(LCDSimulator, null), document.getElementById('root'));
    </script>
  </body>
</html>
