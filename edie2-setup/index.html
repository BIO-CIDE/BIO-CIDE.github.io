<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIE 2 Controller - Setup & Operation Guide</title>
    <!-- Tailwind CSS CDN for styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <!-- Google Font for LCD Screen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <!-- Custom styles for typography, code blocks, icons, tables, alerts, etc. -->
    <style>
      /* Base typography settings */
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif;
      }
      /* Styling for inline code blocks */
      code {
        background-color: #e5e7eb; /* Tailwind gray-200 */
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9em;
        color: #b91c1c; /* red-700 */
      }
      /* SVG icon default sizing */
      .icon {
        display: inline-block;
        width: 1.25em;
        height: 1.25em;
        margin-right: 0.5em;
        vertical-align: text-bottom;
      }
      /* Enhanced table styling */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
      }
      th, td {
        border: 1px solid #d1d5db;
        padding: 0.75rem;
        text-align: left;
      }
      th {
        background-color: #f3f4f6;
        font-weight: 600;
        color: #374151;
      }
      tbody tr:nth-child(odd) {
        background-color: #ffffff;
      }
      tbody tr:nth-child(even) {
        background-color: #f9fafb;
      }
      /* Alert message styling */
      .alert {
        border-radius: 0.375rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .alert-info {
        background-color: #eff6ff;
        border-left: 4px solid #3b82f6;
        color: #1e40af;
      }
      .alert-warning {
        background-color: #fffbeb;
        border-left: 4px solid #f59e0b;
        color: #92400e;
      }
      .alert-danger {
        background-color: #fef2f2;
        border-left: 4px solid #ef4444;
        color: #991b1b;
      }
      .alert-success {
        background-color: #f0fdf4;
        border-left: 4px solid #22c55e;
        color: #15803d;
      }
      /* Checklist list-style modifications */
      ul.checklist {
        list-style: none;
        padding-left: 0;
      }
      ul.checklist li {
        position: relative;
        padding-left: 1.8em;
        margin-bottom: 0.5em;
      }
      ul.checklist li::before {
        content: '✓';
        color: #16a34a; /* Tailwind green-600 */
        position: absolute;
        left: 0;
        font-weight: bold;
      }
      /* LCD Button-like styling */
      .lcd-button {
        display: inline-block;
        background-color: #6b7280; /* Tailwind gray-500 */
        color: white;
        padding: 0.2rem 0.6rem;
        border-radius: 0.25rem;
        font-family: monospace;
        font-size: 0.9em;
        margin: 0 0.2em;
        box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      }
      /* NEW: LCD Screen styling */
      .lcd-screen-container {
        background-color: #4a5568; /* Tailwind gray-600 */
        border: 2px solid #2d3748; /* Tailwind gray-800 */
        border-radius: 0.5rem;
        padding: 0.75rem;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.1);
        max-width: 420px; /* Approximate width for a 20-char screen */
      }
      .lcd-screen-glass {
        background-color: #1a3633; /* Dark teal/blue background */
        border-radius: 0.25rem;
        padding: 0.5rem;
        border: 1px solid #2c7a7b; /* Teal border */
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
      }
      .lcd-screen-text-line {
        font-family: 'VT323', monospace;
        color: #cffafe; /* Light cyan text color */
        text-shadow: 0 0 5px rgba(107, 237, 222, 0.7);
        font-size: 1.5rem; /* Larger font size for pixel effect */
        line-height: 1.2;
        white-space: pre; /* Preserve spaces and layout */
        height: 1.5rem; /* Set fixed height for line */
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Root element for our React app -->
    <div id="root"></div>

    <!-- Including React and ReactDOM libraries -->
    <script
      src="https://unpkg.com/react@17/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel compiler to enable JSX syntax -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Main React Application -->
    <script type="text/babel">
      "use strict";

      // Destructure useState from React
      const { useState } = React;

      // Icon Components: Represent various icons used throughout the UI.
      const WifiIcon = () => (
        <svg className="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" > <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.394 9.393a15 15 0 0121.213 0"></path> </svg>
      );
      const SettingsIcon = () => (
        <svg className="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"> <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path> <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path> </svg>
      );
      const WarningIcon = () => (
        <svg className="icon text-red-500" viewBox="0 0 20 20" fill="currentColor"> <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd"></path> </svg>
      );
      const InfoIcon = () => (
        <svg className="icon text-blue-500" viewBox="0 0 20 20" fill="currentColor"> <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd"></path> </svg>
      );
      const LcdIcon = () => (
        <svg className="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"> <path d="M3 4C3 2.89543 3.89543 2 5 2H19C20.1046 2 21 2.89543 21 4V16C21 17.1046 20.1046 18 19 18H5C3.89543 18 3 17.1046 3 16V4Z" /> <path d="M7 22C7 21.4477 7.44772 21 8 21H16C16.5523 21 17 21.4477 17 22H7Z" /> <rect x="5" y="4" width="14" height="12" rx="1" fill="#e5e7eb" /> <path d="M7 6H17M7 8H17M7 10H17M7 12H12" stroke="#4b5563" strokeWidth="1" strokeLinecap="round" /> </svg>
      );
      const WebIcon = () => (
        <svg className="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor"> <path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253" /> </svg>
      );
      const CloudIcon = () => (
        <svg className="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor"> <path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" /> </svg>
      );
       const DollarIcon = () => (
        <svg className="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor"> <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /> </svg>
      );
      
      // Reusable component for the LCD Screen
      const LcdScreen = ({ lines }) => {
        // Ensure we always have 4 lines, even if fewer are provided
        const displayLines = [...lines];
        while (displayLines.length < 4) {
          displayLines.push("");
        }

        return (
          <div className="lcd-screen-container">
            <div className="lcd-screen-glass">
              {displayLines.slice(0, 4).map((line, index) => (
                <div key={index} className="lcd-screen-text-line">
                  {line}
                </div>
              ))}
            </div>
          </div>
        );
      };

      // Main Component for EDIE Controller Instructions
      const EdieControllerInstructions = () => {
        // State to control which section is currently active
        const [activeSection, setActiveSection] = useState('initial');

        // Array of section information for navigation
        const sections = [
          { id: 'initial', title: '1. Initial Connection' },
          { id: 'basic_setup', title: '2. Basic Setup (Web)' },
          { id: 'lcd_ops', title: '3. LCD Menu Operation' },
          { id: 'calibration', title: '4. Calibration' },
          { id: 'operation', title: '5. System Operation' },
          { id: 'cloud_activation', title: '6. Cloud Dashboard Activation' },
          { id: 'cloud_cost', title: '7. Cloud Cost Analysis' },
          { id: 'advanced_settings', title: '8. Advanced Settings (Web)' },
          { id: 'hardware', title: '9. Hardware Connections' },
          { id: 'troubleshooting', title: '10. Troubleshooting' }
        ];
        
        // Data for the LCD Home Screen
        const homeScreenLines = [
          '12.3 GPM       5 PPM',
          'Stat: SYSTEM OK',
          'Pump: RUNNING',
          '14:30:15',
        ];

        return (
          <div className="bg-gray-100 min-h-screen">
            {/* Header Section */}
            <header className="bg-gradient-to-r from-red-700 to-red-900 text-white p-6 shadow-lg relative">
              <h1 className="text-4xl font-bold">EDIE 2 Controller</h1>
              <p className="mt-1 text-red-200">
                Electronic Data Monitoring and Injection Equipment - Setup, Calibration, and Operation Guide
              </p>
            </header>

            {/* Main Container */}
            <div className="container mx-auto p-6">
               <div className="alert alert-warning" role="alert">
                <div className="flex items-center">
                  <WarningIcon />
                  <div>
                    <p className="font-bold">DEVELOPMENT STATUS ADVISORY</p>
                    <p> This controller firmware is under active development. Core functionality and safety features are implemented, but features may change. Always verify system operation and monitor dosing independently. </p>
                  </div>
                </div>
              </div>

              <div className="flex flex-col lg:flex-row gap-8">
                {/* Navigation Sidebar */}
                <nav className="lg:w-1/4">
                  <div className="bg-white rounded-lg shadow-lg p-4 sticky top-6">
                    <h2 className="text-xl font-bold mb-4 text-red-800 border-b border-gray-200 pb-2">
                      Navigation
                    </h2>
                    <ul className="space-y-1">
                      {sections.map((section) => (
                        <li key={section.id}>
                          <button
                            onClick={() => setActiveSection(section.id)}
                            className={`w-full text-left p-3 rounded-md hover:bg-red-100 hover:text-red-800 transition-colors duration-150 ${
                              activeSection === section.id
                                ? 'bg-red-600 text-white font-semibold shadow-sm'
                                : 'text-gray-700'
                            }`}
                          >
                            {section.title}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                </nav>

                {/* Main Content Area */}
                <main className="lg:w-3/4">
                  <div className="bg-white rounded-lg shadow-lg p-6 md:p-8">
                    {/* 1. Initial Connection Section */}
                    {activeSection === 'initial' && (
                      <section>
                        <h2 className="text-2xl font-bold text-red-800 mb-6 border-b pb-2">
                          1. Initial Connection & Access
                        </h2>
                        <div className="space-y-6 prose max-w-none">
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-red-600 mr-3"> ① </span> Power Up
                            </h3>
                            <p>Connect the controller to a suitable power source. The LCD screen will power on and display the Home Screen after initializing.</p>
                          </div>
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-red-600 mr-3"> ② </span> Connect via Wi‑Fi (Default AP Mode)
                            </h3>
                            <p>By default, the controller starts in Access Point (AP) mode, creating its own Wi‑Fi network.</p>
                            <ul className="list-disc pl-5">
                              <li>Scan for Wi‑Fi networks and connect to the one named after the controller’s <strong>Serial ID</strong> (e.g., <code>EM1001</code>).</li>
                              <li>Use the default password: <code>PASSWORD</code> (case‑sensitive).</li>
                            </ul>
                          </div>
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-red-600 mr-3"> ③ </span> Access the Web Interface
                            </h3>
                            <ul className="list-disc pl-5">
                              <li>Once connected, open a web browser. Most devices will automatically open a "Captive Portal" login page. This is the controller's web interface.</li>
                              <li>If it doesn't open automatically, manually navigate to: <code>http://192.168.4.1</code></li>
                              <li>Alternatively, try: <code>http://[SerialID].local</code> (e.g., <code>http://EM1001.local</code>).</li>
                            </ul>
                          </div>
                          <div className="alert alert-info">
                            <h4 className="font-semibold text-blue-700 flex items-center">
                              <InfoIcon /> Default Access PINs
                            </h4>
                            <p className="text-sm text-gray-600 mb-2"> Initial 4‑digit PINs required to access protected sections:</p>
                            <ul className="mt-1 space-y-1 text-sm">
                              <li> <strong>User Level PIN:</strong> <code>1020</code> </li>
                              <li> <strong>Tech Level PIN:</strong> <code>3396</code> </li>
                              <li> <strong>Master Level PIN:</strong> <code>1213</code> </li>
                            </ul>
                            <p className="mt-2 text-xs text-gray-500"> It is strongly recommended to change these default PINs in the Web UI for security. </p>
                          </div>
                        </div>
                      </section>
                    )}

                    {/* 2. Basic Setup (Web Interface) Section */}
                    {activeSection === 'basic_setup' && (
                      <section>
                        <h2 className="text-2xl font-bold text-red-800 mb-6 border-b pb-2"> 2. Basic Setup Configuration (Web Interface) </h2>
                        <p className="mb-6 text-gray-600"> Configure core operational parameters via the Web Interface. Navigate to the "Settings" tab. You will need the appropriate PIN to save changes. </p>
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                            <SettingsIcon /> Operational Parameters
                          </h3>
                           <div className="overflow-x-auto">
                            <table className="min-w-full border border-gray-200 text-sm">
                              <thead className="bg-gray-100">
                                <tr>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600"> Parameter </th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600"> Description &amp; Notes </th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600"> Required PIN </th>
                                </tr>
                              </thead>
                              <tbody>
                                <tr>
                                  <td className="px-4 py-2 border font-medium"> Desired PPM </td>
                                  <td className="px-4 py-2 border"> Target chemical concentration in the treated water. </td>
                                  <td className="px-4 py-2 border"> User (<code>1020</code>) </td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border font-medium"> Product Selection </td>
                                  <td className="px-4 py-2 border"> Select the chemical product being used (e.g., PRO-OXINE). Affects concentration calculations. </td>
                                   <td className="px-4 py-2 border"> Tech (<code>3396</code>) </td>
                                </tr>
                                <tr>
                                  <td className="px-4 py-2 border font-medium"> Product Acid Ratio </td>
                                  <td className="px-4 py-2 border"> Ratio of Chemical to Acid (e.g., <code>5.0</code> for 5 parts Chemical to 1 part Acid). </td>
                                  <td className="px-4 py-2 border"> User (<code>1020</code>) </td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border font-medium"> Chem Pump Weight </td>
                                  <td className="px-4 py-2 border"> Maximum capacity of the chemical pump in Gallons Per Hour (GPH). </td>
                                   <td className="px-4 py-2 border"> Tech (<code>3396</code>) </td>
                                </tr>
                                <tr>
                                  <td className="px-4 py-2 border font-medium"> Acid Stroke Volume </td>
                                  <td className="px-4 py-2 border"> Volume (in mL) dispensed by the acid pump per single pulse. </td>
                                  <td className="px-4 py-2 border"> Tech (<code>3396</code>) </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </section>
                    )}

                    {/* 3. LCD Menu Operation Section */}
                    {activeSection === 'lcd_ops' && (
                      <section>
                        <h2 className="text-2xl font-bold text-red-800 mb-6 border-b pb-2 flex items-center"> <LcdIcon /> 3. LCD Menu Operation </h2>
                        <div className="prose max-w-none space-y-4">
                          <p> The controller features a 20x4 LCD and four physical buttons for local configuration. </p>
                          <div>
                            <h3 className="font-semibold">Buttons</h3>
                            <ul className="list-none pl-0 flex space-x-2">
                              <li> <span className="lcd-button">UP</span>: Move selection up, increase value. </li>
                              <li> <span className="lcd-button">DOWN</span>: Move selection down, decrease value. </li>
                              <li> <span className="lcd-button">ENTER</span>: Select menu item, confirm value. </li>
                              <li> <span className="lcd-button">EXIT</span>: Go back, cancel edit. </li>
                            </ul>
                          </div>
                          <div>
                            <h3 className="font-semibold">Home Screen</h3>
                            <div className="my-4">
                                <LcdScreen lines={homeScreenLines} />
                            </div>
                            <ul className="list-disc pl-5 text-sm">
                              <li> <strong>Line 1:</strong> Current Flow Rate and Desired PPM setting. </li>
                              <li> <strong>Line 2:</strong> Overall system status message. </li>
                              <li> <strong>Line 3:</strong> Pump operational status. </li>
                              <li> <strong>Line 4:</strong> Current Time or System Runtime. </li>
                            </ul>
                          </div>
                           <div>
                            <h3 className="font-semibold">Menu Navigation & Editing</h3>
                            <ul className="list-disc pl-5 text-sm">
                                <li> From the Home Screen, press <span className="lcd-button">ENTER</span> to access the Settings Hub, or <span className="lcd-button">DOWN</span> for the Status Menu.</li>
                                <li> Use the buttons to navigate menus, select items, and edit values.</li>
                                <li> Menus requiring a PIN will prompt for entry. Use <span className="lcd-button">UP</span>/<span className="lcd-button">DOWN</span> to select a digit and <span className="lcd-button">ENTER</span> to confirm it.</li>
                                <li> If inactive for 30 seconds, the screen returns to the Home Screen.</li>
                            </ul>
                          </div>
                        </div>
                      </section>
                    )}
                    
                    {/* 4. Calibration Section */}
                    {activeSection === 'calibration' && (
                      <section>
                        <h2 className="text-2xl font-bold text-red-800 mb-6 border-b pb-2"> 4. Sensor & Output Calibration (Requires Tech PIN <code>3396</code>) </h2>
                        <p className="mb-6 text-gray-600"> Accurate calibration is crucial. Perform these steps via the Web Interface ("Calibration" tab) or the LCD Menu ("Calibration" option). </p>
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3">Flow Sensor Calibration</h3>
                          <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                            <li> Stop all water flow. Capture the raw ADC value for the <strong>Min Calibrate Flow</strong>. </li>
                            <li> Run water at a known, stable maximum rate. Capture the raw ADC value for the <strong>Max Calibrate Flow</strong>. </li>
                            <li> Enter the known GPM rate into the <strong>Max Flow Rate</strong> field. </li>
                          </ul>
                        </div>
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3"> GP8302 DAC (Analog Output) Calibration </h3>
                           <p className="text-sm text-gray-600 mb-4"> Use a multimeter in series with the output terminals to measure current. The Web UI provides a real-time test mode. </p>
                           <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                             <li> For the Chem Pump (4-20mA), adjust the raw DAC values until the multimeter reads exactly 4.0mA and 20.0mA at the respective test points. </li>
                             <li> Repeat for the Flow Mirror and PPM outputs if used. </li>
                           </ul>
                        </div>
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
