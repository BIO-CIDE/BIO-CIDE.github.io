<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding and viewport configuration -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIE Controller Setup Instructions (v2)</title>
    <!-- Tailwind CSS CDN for styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <!-- Custom styles for typography, code blocks, icons, tables, alerts, etc. -->
    <style>
      /* Base typography settings */
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif;
      }
      /* Styling for inline code blocks */
      code {
        background-color: #e5e7eb; /* Tailwind gray-200 */
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9em;
      }
      /* SVG icon default sizing */
      .icon {
        display: inline-block;
        width: 1.25em;
        height: 1.25em;
        margin-right: 0.5em;
        vertical-align: text-bottom;
      }
      /* Enhanced table styling */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
      }
      th, td {
        border: 1px solid #d1d5db;
        padding: 0.75rem;
        text-align: left;
      }
      th {
        background-color: #f3f4f6;
        font-weight: 600;
        color: #374151;
      }
      tbody tr:nth-child(odd) {
        background-color: #ffffff;
      }
      tbody tr:nth-child(even) {
        background-color: #f9fafb;
      }
      /* Alert message styling */
      .alert {
        border-radius: 0.375rem;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .alert-info {
        background-color: #eff6ff;
        border-left: 4px solid #3b82f6;
        color: #1e40af;
      }
      .alert-warning {
        background-color: #fffbeb;
        border-left: 4px solid #f59e0b;
        color: #92400e;
      }
      .alert-danger {
        background-color: #fef2f2;
        border-left: 4px solid #ef4444;
        color: #991b1b;
      }
      .alert-success {
        background-color: #f0fdf4;
        border-left: 4px solid #22c55e;
        color: #15803d;
      }
      /* Checklist list-style modifications */
      ul.checklist {
        list-style: none;
        padding-left: 0;
      }
      ul.checklist li {
        position: relative;
        padding-left: 1.8em;
        margin-bottom: 0.5em;
      }
      ul.checklist li::before {
        content: '✓';
        color: #16a34a; /* Tailwind green-600 */
        position: absolute;
        left: 0;
        font-weight: bold;
      }
      /* LCD Button-like styling */
      .lcd-button {
        display: inline-block;
        background-color: #6b7280; /* Tailwind gray-500 */
        color: white;
        padding: 0.2rem 0.6rem;
        border-radius: 0.25rem;
        font-family: monospace;
        font-size: 0.9em;
        margin: 0 0.2em;
        box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Root element for our React app -->
    <div id="root"></div>

    <!-- Including React and ReactDOM libraries -->
    <script
      src="https://unpkg.com/react@17/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel compiler to enable JSX syntax -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Main React Application -->
    <script type="text/babel">
      "use strict";

      // Destructure useState from React
      const { useState } = React;

      // Icon Components: Represent various icons used throughout the UI.
      const WifiIcon = () => (
        <svg
          className="icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.394 9.393a15 15 0 0121.213 0"
          ></path>
        </svg>
      );

      const SettingsIcon = () => (
        <svg
          className="icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          ></path>
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          ></path>
        </svg>
      );

      const WarningIcon = () => (
        <svg
          className="icon text-red-500"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fillRule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
            clipRule="evenodd"
          ></path>
        </svg>
      );

      const InfoIcon = () => (
        <svg
          className="icon text-blue-500"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fillRule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
            clipRule="evenodd"
          ></path>
        </svg>
      );

      const LcdIcon = () => (
        <svg
          className="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path d="M3 4C3 2.89543 3.89543 2 5 2H19C20.1046 2 21 2.89543 21 4V16C21 17.1046 20.1046 18 19 18H5C3.89543 18 3 17.1046 3 16V4Z" />
          <path d="M7 22C7 21.4477 7.44772 21 8 21H16C16.5523 21 17 21.4477 17 22H7Z" />
          <rect x="5" y="4" width="14" height="12" rx="1" fill="#e5e7eb" />
          <path
            d="M7 6H17M7 8H17M7 10H17M7 12H12"
            stroke="#4b5563"
            strokeWidth="1"
            strokeLinecap="round"
          />
        </svg>
      );

      const WebIcon = () => (
        <svg
          className="icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          strokeWidth="1.5"
          stroke="currentColor"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253"
          />
        </svg>
      );

      const CloudIcon = () => (
        <svg
          className="icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          strokeWidth="1.5"
          stroke="currentColor"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            d="M12 16.5V9.75m0 0l3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"
          />
        </svg>
      );

      // Main Component for EDIE Controller Instructions
      const EdieControllerInstructions = () => {
        // State to control which section is currently active
        const [activeSection, setActiveSection] = useState('initial');

        // Array of section information for navigation
        const sections = [
          { id: 'initial', title: '1. Initial Connection' },
          { id: 'basic_setup', title: '2. Basic Setup (Web)' },
          { id: 'lcd_ops', title: '3. LCD Menu Operation' },
          { id: 'web_control', title: '4. Web Control Interface' },
          { id: 'calibration', title: '5. Calibration' },
          { id: 'serial_id', title: '6. Changing Serial ID' },
          { id: 'data_history', title: '7. Data & History' },
          { id: 'advanced_settings', title: '8. Advanced Settings (Web)' },
          { id: 'hardware', title: '9. Hardware Connections' },
          { id: 'operation', title: '10. System Operation' },
          { id: 'troubleshooting', title: '11. Troubleshooting' },
          { id: 'known_issues', title: '12. Known Issues' }
        ];

        return (
          <div className="bg-gray-100 min-h-screen">
            {/* Header Section */}
            <header className="bg-gradient-to-r from-blue-700 to-blue-900 text-white p-6 shadow-lg relative">
              <div className="absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full shadow-sm font-semibold tracking-wide">
                BETA
              </div>
              <h1 className="text-4xl font-bold">EDIE Controller (v2)</h1>
              <p className="mt-1 text-blue-200">
                Setup, Calibration, and Operation Guide
              </p>
            </header>

            {/* Main Container */}
            <div className="container mx-auto p-6">
              {/* Beta advisory alert */}
              <div className="alert alert-warning" role="alert">
                <div className="flex items-center">
                  <WarningIcon />
                  <div>
                    <p className="font-bold">BETA STATUS ADVISORY</p>
                    <p>
                      This controller firmware (v2) is under active development.
                      Core functionality and safety features are implemented, but
                      some features like Cloudflare integration may have limitations.
                      Always verify system operation and monitor dosing independently.
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex flex-col lg:flex-row gap-8">
                {/* Navigation Sidebar */}
                <nav className="lg:w-1/4">
                  <div className="bg-white rounded-lg shadow-lg p-4 sticky top-6">
                    <h2 className="text-xl font-bold mb-4 text-blue-800 border-b border-gray-200 pb-2">
                      Navigation
                    </h2>
                    <ul className="space-y-1">
                      {sections.map((section) => (
                        <li key={section.id}>
                          <button
                            onClick={() => setActiveSection(section.id)}
                            className={`w-full text-left p-3 rounded-md hover:bg-blue-100 hover:text-blue-800 transition-colors duration-150 ${
                              activeSection === section.id
                                ? 'bg-blue-600 text-white font-semibold shadow-sm'
                                : 'text-gray-700'
                            }`}
                          >
                            {section.title}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                </nav>

                {/* Main Content Area */}
                <main className="lg:w-3/4">
                  <div className="bg-white rounded-lg shadow-lg p-6 md:p-8">
                    {/* 1. Initial Connection Section */}
                    {activeSection === 'initial' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">
                          1. Initial Connection & Access
                        </h2>
                        <div className="space-y-6 prose max-w-none">
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-blue-600 mr-3">
                                ①
                              </span>
                              Power Up
                            </h3>
                            <p>
                              Connect the controller to a suitable power source.
                            </p>
                            <p>The LCD screen will power on and display:</p>
                            <ul className="list-disc pl-5">
                              <li>"EDIE Controller"</li>
                              <li>
                                Its Serial ID (Default: <code>EM1001</code>)
                              </li>
                              <li>"Initializing..."</li>
                              <li>
                                After initialization (~10-30 seconds), it will show
                                the Home Screen (see LCD Operation section).
                              </li>
                            </ul>
                          </div>
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-blue-600 mr-3">
                                ②
                              </span>
                              Connect via Wi‑Fi (Default AP Mode)
                            </h3>
                            <p>
                              By default, the controller starts in Access Point (AP)
                              mode, creating its own Wi‑Fi network.
                            </p>
                            <p>On your phone, tablet, or laptop:</p>
                            <ul className="list-disc pl-5">
                              <li>Scan for available Wi‑Fi networks.</li>
                              <li>
                                Find the network named exactly like the controller’s{" "}
                                <strong>Serial ID</strong> (e.g.,{" "}
                                <code>EM1001</code>).
                              </li>
                              <li>
                                Connect to this network using the default password:{" "}
                                <code>PASSWORD</code> (Note: This is case‑sensitive).
                              </li>
                            </ul>
                          </div>
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-blue-600 mr-3">
                                ③
                              </span>
                              Access the Web Interface
                            </h3>
                            <p>Once connected to the controller’s Wi‑Fi network:</p>
                            <ul className="list-disc pl-5">
                              <li>
                                Open a web browser (Chrome, Firefox, Safari recommended).
                              </li>
                              <li>
                                Most devices will automatically open a "Captive Portal"
                                login page. This is the controller's web interface.
                              </li>
                              <li>
                                If the portal doesn't open automatically, try navigating
                                to any external website (e.g.,{" "}
                                <code>http://google.com</code>) – this should trigger the
                                redirect.
                              </li>
                              <li>
                                As a last resort, manually navigate to the controller's IP
                                address: <code>http://192.168.4.1</code>
                              </li>
                              <li>
                                Alternatively, if your device supports mDNS (like most
                                Apple devices, Linux, and some Windows setups with
                                Bonjour), you can try: <code>http://[SerialID].local</code>{" "}
                                (e.g., <code>http://EM1001.local</code>).
                              </li>
                            </ul>
                            <p>
                              You should now see the EDIE Controller web dashboard.
                            </p>
                          </div>
                          <div className="alert alert-info">
                            <h4 className="font-semibold text-blue-700 flex items-center">
                              <InfoIcon />
                              Default Access PINs
                            </h4>
                            <p className="text-sm text-gray-600 mb-2">
                              Initial 4‑digit PINs required to access protected sections
                              of the Web UI or LCD Menu:
                            </p>
                            <ul className="mt-1 space-y-1 text-sm">
                              <li>
                                <strong>User Level PIN:</strong> <code>1111</code>
                              </li>
                              <li>
                                <strong>Tech Level PIN:</strong> <code>2222</code>
                              </li>
                              <li>
                                <strong>Master Level PIN:</strong> <code>9999</code>
                              </li>
                            </ul>
                            <p className="mt-2 text-xs text-gray-500">
                              Strongly recommended: Change these default PINs in the Web UI
                              Settings section for security.
                            </p>
                          </div>
                        </div>
                      </section>
                    )}

                    {/* 2. Basic Setup (Web Interface) Section */}
                    {activeSection === 'basic_setup' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">
                          2. Basic Setup Configuration (Web Interface)
                        </h2>
                        <p className="mb-6 text-gray-600">
                          Configure core operational parameters via the Web Interface.
                          Navigate to the "Parameters" tab. You will need the User PIN (
                          <code>1111</code> by default) to save changes.
                        </p>
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                            <SettingsIcon /> Operational Parameters (User PIN:{" "}
                            <code>1111</code>)
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">
                            Adjust these settings in the first form on the "Parameters" tab:
                          </p>
                          <div className="overflow-x-auto">
                            <table className="min-w-full border border-gray-200 text-sm">
                              <thead className="bg-gray-100">
                                <tr>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">
                                    Parameter
                                  </th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">
                                    Description &amp; Notes
                                  </th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">
                                    Typical Range
                                  </th>
                                </tr>
                              </thead>
                              <tbody className="bg-white">
                                <tr>
                                  <td className="px-4 py-2 border font-medium">
                                    Desired PPM
                                  </td>
                                  <td className="px-4 py-2 border">
                                    Target chemical concentration (e.g., ClO2) in the treated
                                    water.
                                  </td>
                                  <td className="px-4 py-2 border">
                                    <code>3</code> – <code>500</code>
                                  </td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border font-medium">
                                    Product Selection
                                  </td>
                                  <td className="px-4 py-2 border">
                                    Select the chemical product being used. This affects
                                    concentration calculations. (Master PIN needed to change via
                                    LCD).
                                  </td>
                                  <td className="px-4 py-2 border">
                                    List (PRO-OXINE, etc.)
                                  </td>
                                </tr>
                                <tr>
                                  <td className="px-4 py-2 border font-medium">
                                    Product Acid Ratio
                                  </td>
                                  <td className="px-4 py-2 border">
                                    Ratio of Chemical to Acid (e.g., <code>5.0</code> means 5
                                    parts Chemical to 1 part Acid). Used for calculating acid pump
                                    rate. (Tech PIN needed)
                                  </td>
                                  <td className="px-4 py-2 border">
                                    <code>0.1</code> – <code>50.0</code>
                                  </td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border font-medium">
                                    Chem Pump Weight
                                  </td>
                                  <td className="px-4 py-2 border">
                                    Maximum capacity of the chemical pump in Gallons Per Hour
                                    (GPH). Used for scaling the 4-20mA output. (Tech PIN needed)
                                  </td>
                                  <td className="px-4 py-2 border">
                                    <code>0.1</code> – <code>10.0</code>
                                  </td>
                                </tr>
                                <tr>
                                  <td className="px-4 py-2 border font-medium">
                                    Acid Stroke Volume
                                  </td>
                                  <td className="px-4 py-2 border">
                                    Volume (in mL) dispensed by the acid pump per single pulse/stroke.
                                    Used for calculating acid pump rate. (Tech PIN needed)
                                  </td>
                                  <td className="px-4 py-2 border">
                                    <code>0.01</code> – <code>20.0</code>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save Parameters
                          </button>
                        </div>
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                            <SettingsIcon /> Display &amp; Time Settings (User PIN:{" "}
                            <code>1111</code>)
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">
                            Adjust these settings in the second form on the "Parameters" tab:
                          </p>
                          <div className="overflow-x-auto">
                            <table className="min-w-full border border-gray-200 text-sm">
                              <thead className="bg-gray-100">
                                <tr>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">
                                    Parameter
                                  </th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">
                                    Description
                                  </th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">
                                    Options
                                  </th>
                                </tr>
                              </thead>
                              <tbody>
                                <tr>
                                  <td className="px-4 py-2 border">Dashboard Display</td>
                                  <td className="px-4 py-2 border">
                                    Choose what the time display shows on the Web UI Dashboard and
                                    LCD Home screen.
                                  </td>
                                  <td className="px-4 py-2 border">
                                    <code>Show Current Time</code> /{" "}
                                    <code>Show Runtime</code>
                                  </td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border">Timezone Offset</td>
                                  <td className="px-4 py-2 border">
                                    Set your local time difference from UTC (Coordinated Universal
                                    Time) in hours. Needed for correct time display when using NTP
                                    (Station Mode only).
                                  </td>
                                  <td className="px-4 py-2 border">
                                    <code>-12.0</code> to <code>+14.0</code> (in 0.5 hr steps)
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                          <p className="text-xs text-gray-500 mt-2">
                            Examples: EST=-5, CST=-6, MST=-7, PST=-8, London=0, Berlin=+1.
                          </p>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save Display Settings
                          </button>
                        </div>
                      </section>
                    )}

                    {/* 3. LCD Menu Operation Section */}
                    {activeSection === 'lcd_ops' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2 flex items-center">
                          <LcdIcon /> 3. LCD Menu Operation
                        </h2>
                        <p className="mb-6 text-gray-600">
                          The controller features a 20x4 character LCD screen and four physical
                          buttons for local configuration and status monitoring.

                          <hr />
                          <div>
                            <p className="font-semibold text-gray-800">
                              Issue: Cloudflare connection test fails or emails/uploads don't work.
                            </p>
                            <p className="text-sm text-gray-600 mt-1 pl-4">
                              <strong>Solutions:</strong> Ensure the controller is in STA mode with internet access,
                              double-check the Cloudflare Worker endpoint URL and API Key, and verify recipient email addresses.
                            </p>
                          </div>
                        </div>
                        <div className="border rounded-lg p-4 shadow-sm mt-6">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3">Debugging Tools</h3>
                          <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                            <li>
                              <strong>Web UI Debug Console:</strong> Press <code>Ctrl+Shift+D</code> (or Cmd+Option+D on Mac) to view live logs.
                            </li>
                            <li>
                              <strong>Diagnostics Endpoint:</strong> Navigate to <code>/diag</code> on the controller's address for status summary.
                            </li>
                            <li>
                              <strong>Serial Monitor:</strong> Use a serial terminal at 115200 baud rate via USB for detailed boot and error logs.
                            </li>
                            <li>
                              <strong>LCD Display:</strong> Check the Home Screen for error messages and statuses.
                            </li>
                          </ul>
                        </div>
                      </section>
                    )}

                    {/* 12. Known Issues Section */}
                    {activeSection === 'known_issues' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">
                          12. Known Issues &amp; Limitations (BETA v2)
                        </h2>
                        <p className="mb-6 text-gray-600">
                          While functionality has been expanded, this firmware is still in Beta.
                          Be aware of the following limitations:
                        </p>
                        <div className="alert alert-warning mb-4">
                          <p className="font-bold">Cloudflare Integration</p>
                          <p className="mt-1 text-sm">
                            Cloudflare features depend on proper setup (Worker script, API Key)
                            and network reliability. Intermittent issues may occur.
                          </p>
                        </div>
                        <div className="alert alert-warning mb-4">
                          <p className="font-bold">Wi‑Fi Stability (STA Mode)</p>
                          <p className="mt-1 text-sm">
                            STA mode reliability depends on the Wi‑Fi environment. After multiple failed attempts,
                            the controller reverts to AP Mode.
                          </p>
                        </div>
                        <div className="alert alert-warning mb-6">
                          <p className="font-bold">Data Storage Limitations (SPIFFS)</p>
                          <p className="mt-1 text-sm">
                            Without an SD card, logs stored in SPIFFS are limited (~100 KB). Log rotation occurs frequently.
                          </p>
                        </div>
                        <div className="alert alert-danger">
                          <h4 className="font-semibold text-red-700 flex items-center">
                            <WarningIcon /> Final System Verification Required!
                          </h4>
                          <p className="mt-1 text-sm text-red-600">
                            This controller is a component in a potentially hazardous chemical dosing system.
                            Always perform independent verification of water quality after installation and calibration.
                            Follow all safety protocols when handling chemicals and operating the system.
                          </p>
                        </div>
                      </section>
                    )}

                    {/* Footer */}
                    <div className="mt-10 pt-6 border-t border-gray-200 text-center text-xs text-gray-500">
                      <p>EDIE Controller Instructions | Firmware Version: 1.3 BETA-V2 (LCD/Web Control)</p>
                      <p className="mt-1">
                        For technical support, contact the manufacturer or system provider.
                      </p>
                    </div>
                  </div>
                </main>
              </div>
            </div>
          </div>
        );
      };

      // Render the application into the root element
      ReactDOM.render(
        <EdieControllerInstructions />,
        document.getElementById("root")
      );
    </script>
  </body>
