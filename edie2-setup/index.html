<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIE Controller Setup Instructions (v2)</title>
    <!-- Tailwind CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      /* Base typography */
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif;
      }
      /* Code block styling */
      code {
        background-color: #e5e7eb; /* gray-200 */
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9em;
      }
      /* SVG icon sizing */
      .icon {
        display: inline-block;
        width: 1.25em;
        height: 1.25em;
        margin-right: 0.5em;
        vertical-align: text-bottom;
      }
      /* Enhanced table styling */
      table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
      th, td { border: 1px solid #d1d5db; padding: 0.75rem; text-align: left; }
      th { background-color: #f3f4f6; font-weight: 600; color: #374151; }
      tbody tr:nth-child(odd) { background-color: #ffffff; }
      tbody tr:nth-child(even) { background-color: #f9fafb; }
      /* Alert styling */
      .alert { border-radius: 0.375rem; padding: 1rem; margin-bottom: 1rem; }
      .alert-info { background-color: #eff6ff; border-left: 4px solid #3b82f6; color: #1e40af; }
      .alert-warning { background-color: #fffbeb; border-left: 4px solid #f59e0b; color: #92400e; }
      .alert-danger { background-color: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; }
      .alert-success { background-color: #f0fdf4; border-left: 4px solid #22c55e; color: #15803d; }
      /* List styling */
      ul.checklist { list-style: none; padding-left: 0; }
      ul.checklist li { position: relative; padding-left: 1.8em; margin-bottom: 0.5em; }
      ul.checklist li::before { content: '✓'; color: #16a34a; /* green-600 */ position: absolute; left: 0; font-weight: bold; }
      /* LCD Button representation */
      .lcd-button {
        display: inline-block; background-color: #6b7280; /* gray-500 */ color: white;
        padding: 0.2rem 0.6rem; border-radius: 0.25rem; font-family: monospace;
        font-size: 0.9em; margin: 0 0.2em; box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React and ReactDOM -->
    <script
      src="https://unpkg.com/react@17/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      "use strict";

      const { useState } = React;

      // --- Icon Components (Unchanged) ---
      const WifiIcon = () => ( <svg className="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.394 9.393a15 15 0 0121.213 0"></path></svg> );
      const SettingsIcon = () => ( <svg className="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> );
      const WarningIcon = () => ( <svg className="icon text-red-500" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd"></path></svg> );
      const InfoIcon = () => ( <svg className="icon text-blue-500" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd"></path></svg> );
      const LcdIcon = () => ( <svg className="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4C3 2.89543 3.89543 2 5 2H19C20.1046 2 21 2.89543 21 4V16C21 17.1046 20.1046 18 19 18H5C3.89543 18 3 17.1046 3 16V4Z" /><path d="M7 22C7 21.4477 7.44772 21 8 21H16C16.5523 21 17 21.4477 17 22H7Z" /><rect x="5" y="4" width="14" height="12" rx="1" fill="#e5e7eb"/><path d="M7 6H17M7 8H17M7 10H17M7 12H12" stroke="#4b5563" strokeWidth="1" strokeLinecap="round"/></svg> );
      const WebIcon = () => ( <svg className="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253" /></svg> );
      const CloudIcon = () => ( <svg className="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" /></svg> );

      // --- Main Component ---
      const EdieControllerInstructions = () => {
        const [activeSection, setActiveSection] = useState('initial');

        const sections = [
          { id: 'initial', title: '1. Initial Connection' },
          { id: 'basic_setup', title: '2. Basic Setup (Web)' },
          { id: 'lcd_ops', title: '3. LCD Menu Operation' },
          { id: 'web_control', title: '4. Web Control Interface' },
          { id: 'calibration', title: '5. Calibration' },
          { id: 'serial_id', title: '6. Changing Serial ID' },
          { id: 'data_history', title: '7. Data & History' },
          { id: 'advanced_settings', title: '8. Advanced Settings (Web)' },
          { id: 'hardware', title: '9. Hardware Connections' },
          { id: 'operation', title: '10. System Operation' },
          { id: 'troubleshooting', title: '11. Troubleshooting' },
          { id: 'known_issues', title: '12. Known Issues' }
        ];

        return (
          <div className="bg-gray-100 min-h-screen">
            {/* Header */}
            <header className="bg-gradient-to-r from-blue-700 to-blue-900 text-white p-6 shadow-lg relative">
              <div className="absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full shadow-sm font-semibold tracking-wide">
                BETA
              </div>
              <h1 className="text-4xl font-bold">EDIE Controller (v2)</h1>
              <p className="mt-1 text-blue-200">Setup, Calibration, and Operation Guide</p>
            </header>

            <div className="container mx-auto p-6">
              {/* Beta advisory */}
              <div className="alert alert-warning" role="alert">
                <div className="flex items-center">
                  <WarningIcon />
                  <div>
                    <p className="font-bold">BETA STATUS ADVISORY</p>
                    <p>
                      This controller firmware (v2) is under active development. Core functionality and safety features are implemented,
                      but some features like Cloudflare integration may have limitations. Always verify system operation and monitor dosing independently.
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex flex-col lg:flex-row gap-8">
                {/* Navigation Sidebar */}
                <nav className="lg:w-1/4">
                  <div className="bg-white rounded-lg shadow-lg p-4 sticky top-6">
                    <h2 className="text-xl font-bold mb-4 text-blue-800 border-b border-gray-200 pb-2">Navigation</h2>
                    <ul className="space-y-1">
                      {sections.map((section) => (
                        <li key={section.id}>
                          <button
                            onClick={() => setActiveSection(section.id)}
                            className={`w-full text-left p-3 rounded-md hover:bg-blue-100 hover:text-blue-800 transition-colors duration-150 ${
                              activeSection === section.id ? 'bg-blue-600 text-white font-semibold shadow-sm' : 'text-gray-700'
                            }`}
                          >
                            {section.title}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                </nav>

                {/* Main Content */}
                <main className="lg:w-3/4">
                  <div className="bg-white rounded-lg shadow-lg p-6 md:p-8">
                    {/* --- 1. Initial Connection --- */}
                    {activeSection === 'initial' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">1. Initial Connection & Access</h2>
                        <div className="space-y-6 prose max-w-none">
                          <div>
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center"><span className="text-3xl font-bold text-blue-600 mr-3">①</span> Power Up</h3>
                            <p>Connect the controller to a suitable power source (e.g., 12V DC).</p>
                            <p>The <strong>LCD screen</strong> will power on and display:</p>
                            <ul className="list-disc pl-5">
                                <li>"EDIE Controller"</li>
                                <li>Its Serial ID (Default: <code>EM1001</code>)</li>
                                <li>"Initializing..."</li>
                                <li>After initialization (~10-30 seconds), it will show the Home Screen (see LCD Operation section).</li>
                            </ul>
                          </div>
                          <div>
                             <h3 className="text-lg font-semibold text-gray-800 flex items-center"><span className="text-3xl font-bold text-blue-600 mr-3">②</span> Connect via Wi‑Fi (Default AP Mode)</h3>
                             <p>By default, the controller starts in Access Point (AP) mode, creating its own Wi-Fi network.</p>
                             <p>On your phone, tablet, or laptop:</p>
                              <ul className="list-disc pl-5">
                                  <li>Scan for available Wi‑Fi networks.</li>
                                  <li>Find the network named exactly like the controller’s <strong>Serial ID</strong> (e.g., <code>EM1001</code>).</li>
                                  <li>Connect to this network using the default password: <code>PASSWORD</code> (Note: This is case‑sensitive).</li>
                             </ul>
                          </div>
                          <div>
                             <h3 className="text-lg font-semibold text-gray-800 flex items-center"><span className="text-3xl font-bold text-blue-600 mr-3">③</span> Access the Web Interface</h3>
                              <p>Once connected to the controller’s Wi‑Fi network:</p>
                              <ul className="list-disc pl-5">
                                  <li>Open a web browser (Chrome, Firefox, Safari recommended).</li>
                                  <li>Most devices will automatically open a "Captive Portal" login page. This is the controller's web interface.</li>
                                  <li>If the portal doesn't open automatically, try navigating to any external website (e.g., <code>http://google.com</code>) - this should trigger the redirect.</li>
                                  <li>As a last resort, manually navigate to the controller's IP address: <code>http://192.168.4.1</code></li>
                                  <li>Alternatively, if your device supports mDNS (like most Apple devices, Linux, and some Windows setups with Bonjour), you can try: <code>http://[SerialID].local</code> (e.g., <code>http://EM1001.local</code>).</li>
                              </ul>
                              <p>You should now see the EDIE Controller web dashboard.</p>
                           </div>
                           {/* Default PINs Quick Reference */}
                           <div className="alert alert-info">
                              <h4 className="font-semibold text-blue-700 flex items-center"><InfoIcon /> Default Access PINs</h4>
                              <p className="text-sm text-gray-600 mb-2"> Initial 4‑digit PINs required to access protected sections of the Web UI or LCD Menu:</p>
                              <ul className="mt-1 space-y-1 text-sm">
                                <li><strong>User Level PIN:</strong> <code>1111</code></li>
                                <li><strong>Tech Level PIN:</strong> <code>2222</code></li>
                                <li><strong>Master Level PIN:</strong> <code>9999</code></li>
                              </ul>
                              <p className="mt-2 text-xs text-gray-500"> Strongly recommended: Change these default PINs in the Web UI Settings section for security.</p>
                           </div>
                        </div>
                      </section>
                    )}

                    {/* --- 2. Basic Setup (Web) --- */}
                    {activeSection === 'basic_setup' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">2. Basic Setup Configuration (Web Interface)</h2>
                        <p className="mb-6 text-gray-600">
                          Configure core operational parameters via the Web Interface. Navigate to the "Parameters" tab. You will need the User PIN (<code>1111</code> by default) to save changes.
                        </p>

                        {/* System Parameters Table */}
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                            <SettingsIcon /> Operational Parameters (User PIN: <code>1111</code>)
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">Adjust these settings in the first form on the "Parameters" tab:</p>
                          <div className="overflow-x-auto">
                            <table className="min-w-full border border-gray-200 text-sm">
                              <thead className="bg-gray-100">
                                <tr>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">Parameter</th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">Description & Notes</th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">Typical Range</th>
                                </tr>
                              </thead>
                              <tbody className="bg-white">
                                <tr><td className="px-4 py-2 border font-medium">Desired PPM</td><td className="px-4 py-2 border">Target chemical concentration (e.g., ClO2) in the treated water.</td><td className="px-4 py-2 border"><code>3</code> – <code>500</code></td></tr>
                                <tr className="bg-gray-50"><td className="px-4 py-2 border font-medium">Product Selection</td><td className="px-4 py-2 border">Select the chemical product being used. This affects concentration calculations. (Master PIN needed to change via LCD).</td><td className="px-4 py-2 border">List (PRO-OXINE, etc.)</td></tr>
                                <tr><td className="px-4 py-2 border font-medium">Product Acid Ratio</td><td className="px-4 py-2 border">Ratio of Chemical to Acid (e.g., <code>5.0</code> means 5 parts Chemical to 1 part Acid). Used for calculating acid pump rate. (Tech PIN needed)</td><td className="px-4 py-2 border"><code>0.1</code> – <code>50.0</code></td></tr>
                                <tr className="bg-gray-50"><td className="px-4 py-2 border font-medium">Chem Pump Weight</td><td className="px-4 py-2 border">Maximum capacity of the chemical pump in Gallons Per Hour (GPH). Used for scaling the 4-20mA output. (Tech PIN needed)</td><td className="px-4 py-2 border"><code>0.1</code> – <code>10.0</code></td></tr>
                                <tr><td className="px-4 py-2 border font-medium">Acid Stroke Volume</td><td className="px-4 py-2 border">Volume (in mL) dispensed by the acid pump per single pulse/stroke. Used for calculating acid pump rate. (Tech PIN needed)</td><td className="px-4 py-2 border"><code>0.01</code> – <code>20.0</code></td></tr>
                              </tbody>
                            </table>
                          </div>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save Parameters
                          </button>
                        </div>

                        {/* Display & Time Settings */}
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                             <SettingsIcon /> Display & Time Settings (User PIN: <code>1111</code>)
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">Adjust these settings in the second form on the "Parameters" tab:</p>
                          <div className="overflow-x-auto">
                            <table className="min-w-full border border-gray-200 text-sm">
                               <thead className="bg-gray-100"><tr><th>Parameter</th><th>Description</th><th>Options</th></tr></thead>
                               <tbody>
                                 <tr><td>Dashboard Display</td><td>Choose what the time display shows on the Web UI Dashboard and LCD Home screen.</td><td><code>Show Current Time</code> / <code>Show Runtime</code></td></tr>
                                 <tr className="bg-gray-50"><td>Timezone Offset</td><td>Set your local time difference from UTC (Coordinated Universal Time) in hours. Needed for correct time display when using NTP (Station Mode only).</td><td><code>-12.0</code> to <code>+14.0</code> (in 0.5 hr steps)</td></tr>
                               </tbody>
                            </table>
                          </div>
                          <p className="text-xs text-gray-500 mt-2">Examples: EST=-5, CST=-6, MST=-7, PST=-8, London=0, Berlin=+1.</p>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                             Save Display Settings
                          </button>
                       </div>
                      </section>
                    )}

                    {/* --- 3. LCD Menu Operation --- */}
                    {activeSection === 'lcd_ops' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2 flex items-center"><LcdIcon /> 3. LCD Menu Operation</h2>
                        <p className="mb-6 text-gray-600">
                          The controller features a 20x4 character LCD screen and four physical buttons for local configuration and status monitoring.
                        </p>
                        <div className="prose max-w-none space-y-4">
                            <div>
                                <h3 className="font-semibold">Buttons</h3>
                                <p>The four buttons below the LCD perform the following actions:</p>
                                <ul className="list-none pl-0 flex space-x-2">
                                    <li><span className="lcd-button">UP</span>: Move selection up, increase value.</li>
                                    <li><span className="lcd-button">DOWN</span>: Move selection down, decrease value.</li>
                                    <li><span className="lcd-button">ENTER</span>: Select menu item, confirm value, advance digit.</li>
                                    <li><span className="lcd-button">EXIT</span>: Go back to previous menu, cancel edit, backspace PIN.</li>
                                </ul>
                            </div>
                            <div>
                                <h3 className="font-semibold">Home Screen</h3>
                                <p>After initializing, the LCD shows the main status screen:</p>
                                <pre className="bg-gray-800 text-green-400 p-3 rounded font-mono text-sm">
                                  <code>
                                  SYSTEM RUNNING      <br/> {/* Line 0 */}
                                  F:12.3 GPM PPM:5    <br/> {/* Line 1 */}
                                  P1:0.8     P2:7.2   <br/> {/* Line 2 */}
                                  Time: 14:30:15      <br/> {/* Line 3 (or Runtime or Error) */}
                                  </code>
                                </pre>
                                <ul className="list-disc pl-5 text-sm">
                                    <li>Line 0: Overall system status (RUNNING, STOPPED, PAUSED).</li>
                                    <li>Line 1: Current Flow Rate (GPM) and Desired PPM setting.</li>
                                    <li>Line 2: Probe 1 and Probe 2 readings (value depends on configured type). Shows "---" if probe type is "None".</li>
                                    <li>Line 3: Displays Current Time (if Display Mode=Time & NTP synced), Runtime (if Display Mode=Runtime), or the highest priority active Error/Warning message.</li>
                                </ul>
                            </div>
                             <div>
                                <h3 className="font-semibold">Entering the Menu</h3>
                                <p>From the Home Screen, press <span className="lcd-button">ENTER</span> to access the Main Menu.</p>
                            </div>
                            <div>
                                <h3 className="font-semibold">Navigating Menus</h3>
                                <ul className="list-disc pl-5 text-sm">
                                    <li>Use <span className="lcd-button">UP</span> / <span className="lcd-button">DOWN</span> to highlight different menu options.</li>
                                    <li>A <code>></code> symbol indicates the currently selected item.</li>
                                    <li>Arrows (<span className="font-mono text-xs">{String.fromCharCode(0)}</span> / <span className="font-mono text-xs">{String.fromCharCode(1)}</span>) appear in the first column if the list is scrollable.</li>
                                    <li>Press <span className="lcd-button">ENTER</span> to select the highlighted item and enter its submenu or action.</li>
                                    <li>Press <span className="lcd-button">EXIT</span> to go back to the previous menu level.</li>
                                </ul>
                            </div>
                             <div>
                                <h3 className="font-semibold">Editing Values</h3>
                                <ul className="list-disc pl-5 text-sm">
                                    <li>When editing a numeric value (e.g., Desired PPM, calibration numbers), the screen will show the current value.</li>
                                    <li>Use <span className="lcd-button">UP</span> / <span className="lcd-button">DOWN</span> to increase/decrease the value. The increment step depends on the setting.</li>
                                    <li>Press <span className="lcd-button">ENTER</span> to confirm the new value and save it (for calibration) or apply it (for settings). A "Value Saved" message appears briefly.</li>
                                    <li>Press <span className="lcd-button">EXIT</span> to cancel the edit without changing the value. An "Edit Cancelled" message appears briefly.</li>
                                </ul>
                            </div>
                            <div>
                                <h3 className="font-semibold">PIN Entry</h3>
                                <p>Accessing Settings or Calibration menus requires entering the appropriate PIN (User: <code>1111</code>, Tech: <code>2222</code>, Master: <code>9999</code> default).</p>
                                <ul className="list-disc pl-5 text-sm">
                                    <li>The screen shows "Enter Access PIN:" and underscores for digits (e.g., <code>____</code>).</li>
                                    <li>Use <span className="lcd-button">UP</span> / <span className="lcd-button">DOWN</span> to select the digit (0-9) for the current position.</li>
                                    <li>Press <span className="lcd-button">ENTER</span> to confirm the digit and move to the next position. An asterisk <code>*</code> replaces the digit.</li>
                                    <li>Press <span className="lcd-button">EXIT</span> to backspace/delete the last entered digit.</li>
                                    <li>After entering 4 digits, the system validates the PIN. If correct, you gain access. If incorrect, it shows "Invalid PIN" and clears the entry.</li>
                                </ul>
                            </div>
                             <div>
                                <h3 className="font-semibold">Selecting from Lists</h3>

                              <WarningIcon /> System Reset (Master PIN <code>9999</code>)
                           </h3>

                              <p>This performs a factory reset, restoring all settings to their default values.</p>
                              <div className="alert alert-danger text-xs"><WarningIcon className="inline"/>This action is irreversible! It will erase: Network settings (reverts to AP Mode), Security PINs (reverts to defaults), Operational Parameters, Calibration Data, Display/Time settings, and Cloudflare configuration.</div>
                              <ol>
                                  <li>Enter the Master PIN (<code>9999</code>).</li>
                                  <li>Click the <strong className="text-red-600">Reset System to Defaults</strong> button.</li>
                                  <li>Confirm the action in the pop-up dialog box.</li>

                           <div className="prose max-w-none text-sm">

                               </div>
                           </div>
                        </div>
                      </section>
                    )}

                    {/* --- 9. Hardware Connections --- */}
                    {activeSection === 'hardware' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">9. Hardware Connections Overview</h2>
                        <p className="mb-6 text-gray-600">Summary of primary hardware interfaces and pin assignments for V2 firmware.</p>

                        {/* I2C Bus */}
                        <div className="border rounded-lg p-4 shadow-sm mb-4">
                           <h3 className="text-lg font-semibold text-gray-800 mb-3">I2C Bus (via TCA9548A MUX @ 0x74)</h3>
                           <p className="text-sm text-gray-600 mb-2">Multiple devices share the I2C bus, selected via the multiplexer:</p>
                           <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                             <li><strong>LCD Display:</strong> Address <code>0x27</code> (or <code>0x3F</code>). Connected directly, not via MUX.</li>
                             <li><strong>MCP23017 I/O Expander:</strong> Address <code>0x20</code> – Accessed via MUX Channel 0.</li>
                             <li><strong>GP8302 DAC (Chem Pump):</strong> Address <code>0x58</code> – Accessed via MUX Channel 0.</li>
                             <li><strong>GP8302 DAC (Flow Mirror):</strong> Address <code>0x58</code> – Accessed via MUX Channel 2.</li>
                             <li><strong>GP8302 DAC (PPM Output):</strong> Address <code>0x58</code> – Accessed via MUX Channel 3.</li>
                             <li><strong>ADS1115 ADC:</strong> Address <code>0x49</code> – Accessed via MUX Channel 4.</li>
                           </ul>
                        </div>

                        {/* Analog Inputs */}
                        <div className="border rounded-lg p-4 shadow-sm mb-4">
                           <h3 className="text-lg font-semibold text-gray-800 mb-3">Analog Inputs (ADS1115 on MUX Ch 4)</h3>
                           <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                             <li><strong>Flow Meter Signal (GPM):</strong> ADC Channel 1 (Pin A1 on ADS1115 breakout)</li>
                             <li><strong>Probe One Signal:</strong> ADC Channel 0 (Pin A0)</li>
                             <li><strong>Probe Two Signal:</strong> ADC Channel 2 (Pin A2)</li>
                           </ul>
                         </div>

                        {/* Digital I/O (MCP23017) */}
                         <div className="border rounded-lg p-4 shadow-sm mb-4">
                           <h3 className="text-lg font-semibold text-gray-800 mb-3">Digital I/O (MCP23017 on MUX Ch 0, Address 0x20)</h3>
                           <p className="text-xs text-gray-500 mb-2">Pin numbers refer to the MCP23017 chip itself (GPA0-7, GPB0-7).</p>
                           <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                             <li>
                               <strong>Inputs (Internal Pullups Enabled in code):</strong>
                               <ul className="list-circle pl-5 text-xs">
                                 <li>Pause Switch (Pin 9 / GPB1): Reads HIGH when paused (switch open), LOW when running (switch closed to GND).</li>
                                 <li>Pump 1 Warning (Pin 4 / GPA4): Reads LOW when warning active.</li>
                                 <li>Pump 1 Alarm (Pin 3 / GPA3): Reads LOW when alarm active.</li>
                                 <li>Pump 2 Warning (Pin 8 / GPB0): Reads LOW when warning active.</li>
                                 <li>Pump 2 Alarm (Pin 7 / GPA7): Reads LOW when alarm active.</li>
                               </ul>
                             </li>
                             <li>
                               <strong>Outputs:</strong>
                               <ul className="list-circle pl-5 text-xs">
                                 <li>Pump 1 Pause (Pin 1 / GPA1): Set HIGH to pause external pump 1.</li>
                                 <li>Pump 2 Pause (Pin 5 / GPA5): Set HIGH to pause external pump 2.</li>
                                 <li>Acid Pump Trigger (Pin 6 / GPA6): Pulsed HIGH to trigger acid pump stroke.</li>
                                 <li>Flow Pulse Output (Pin 14 / GPB6): Pulsed HIGH (1 pulse per gallon).</li>
                               </ul>
                             </li>
                           </ul>
                         </div>

                        {/* Other Connections */}
                        <div className="border rounded-lg p-4 shadow-sm mb-4">
                           <h3 className="text-lg font-semibold text-gray-800 mb-3">Other ESP32 Connections</h3>
                           <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                             <li><strong>Status Relays (Onboard):</strong> GPIO 25 (Error), GPIO 26 (Warning), GPIO 32 (Normal). Set HIGH when condition active.</li>
                             <li><strong>LCD Buttons (Input Pullup):</strong> GPIO 34 (UP), GPIO 35 (DOWN), GPIO 33 (ENTER), GPIO 27 (EXIT). Read LOW when pressed.</li>
                             <li><strong>SD Card (SPI):</strong> Standard SPI pins (MOSI=23, MISO=19, SCK=18), Chip Select (CS) = GPIO 5.</li>
                           </ul>
                         </div>
                      </section>

                    {/* --- 10. System Operation --- */}
                    {activeSection === 'operation' && (
                       <section>
                         <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">10. System Operation</h2>
                         <p className="mb-6 text-gray-600">Overview of the controller's operational logic and states.</p>
                         <div className="space-y-6">
                             {/* Flow States */}
                             <div className="border rounded-lg p-4 shadow-sm">
                               <h3 className="text-lg font-semibold text-gray-800 mb-3">Flow State Management</h3>
                               <p className="text-sm text-gray-600 mb-2">The controller operates in one of three flow states based on the GPM reading:</p>
                               <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center text-sm">
                                 <div className="p-3 bg-red-50 rounded border border-red-200"><p className="font-semibold text-red-700">NO FLOW (State 0)</p><p className="font-mono mt-1">{'<'} ~0.09 GPM</p><p className="text-xs text-gray-600 mt-1">Pumps Stopped</p></div>
                                 <div className="p-3 bg-yellow-50 rounded border border-yellow-200"><p className="font-semibold text-yellow-700">LOW FLOW (State 1)</p><p className="font-mono mt-1">~0.09 - 0.33 GPM</p><p className="text-xs text-gray-600 mt-1">Pumps Run (Warning)</p></div>
                                 <div className="p-3 bg-green-50 rounded border border-green-200"><p className="font-semibold text-green-700">NORMAL FLOW (State 2)</p><p className="font-mono mt-1">{'>='} ~0.33 GPM</p><p className="text-xs text-gray-600 mt-1">Pumps Run</p></div>
                               </div>
                               <p className="text-xs text-gray-500 mt-3 italic">Note: Hysteresis thresholds and a 2.5-second delay prevent rapid state changes near the boundaries.</p>
                             </div>
                             {/* Errors & Warnings */}
                             <div className="border rounded-lg p-4 shadow-sm">
                               <h3 className="text-lg font-semibold text-gray-800 mb-3">Error & Warning Conditions</h3>
                               <p className="text-sm text-gray-600 mb-2">The system monitors several conditions, displayed on the LCD and Web UI. Errors typically stop dosing, while warnings allow operation but indicate a potential issue.</p>
                               <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                 <div>
                                   <p className="font-semibold text-red-600 mb-1">Errors (Halt Dosing):</p>
                                   <ul className="list-disc pl-5 text-gray-700">
                                     <li><code>PUMP_ALARM</code> (External pump fault signal detected)</li>
                                     <li><code>NO_FLOW</code> (Flow rate below minimum threshold)</li>
                                   </ul>
                                 </div>
                                 <div>
                                   <p className="font-semibold text-yellow-600 mb-1">Warnings (Continue Dosing):</p>
                                   <ul className="list-disc pl-5 text-gray-700">
                                     <li><code>PUMP_WARNING</code> (External pump warning signal)</li>
                                     <li><code>LOW_FLOW</code> (Flow rate is low but sufficient to dose)</li>
                                     <li><code>MISWEIGHTED</code> (Calculated dose rate exceeds Chem Pump Weight setting)</li>
                                   </ul>
                                 </div>
                               </div>
                               <div>
                                   <p className="font-semibold text-gray-600 mt-3 mb-1">Paused State:</p>
                                   <ul className="list-disc pl-5 text-gray-700 text-sm">
                                     <li><code>SYSTEM_PAUSED</code> (Physical pause switch activated OR Web Pause override active) - Halts Dosing.</li>
                                   </ul>
                               </div>
                                <p className="text-xs text-gray-500 mt-3 italic">Error states can often be cleared via the LCD Menu (Status → Errors → Enter) once the condition is resolved. Pause state clears when the switch/web toggle is deactivated.</p>
                             </div>
                             {/* Dosing Logic */}
                             <div className="border rounded-lg p-4 shadow-sm">
                               <h3 className="text-lg font-semibold text-gray-800 mb-3">Chemical Dosing Logic</h3>
                               <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                                 <li>Dosing only occurs when <code>pumpEnabled</code> is true (i.e., state is NO_ERROR, LOW_FLOW, PUMP_WARNING, or MISWEIGHTED).</li>
                                 <li><strong>Chem Pump (4-20mA Output):</strong> The current is calculated based on flow rate (GPM), desired PPM, product concentration, and pump weight (GPH). Output scales from 4mA (0 GPH demand) to 20mA (Pump Weight GPH demand).</li>
                                 <li><strong>Acid Pump (Pulse Output):</strong> The controller calculates the required acid volume based on the chemical dose rate and the Product:Acid Ratio. It then pulses the Acid Pump Trigger pin HIGH at the required frequency, considering the Acid Stroke Volume (mL/pulse).</li>
                                 <li><strong>Flow Pulse Output:</strong> The controller generates one pulse on the Flow Pulse Output pin for every gallon of water measured by the flow meter, useful for external totalizers.</li>
                               </ul>
                             </div>
                              {/* Time Sync */}
                              <div className="border rounded-lg p-4 shadow-sm">
                                 <h3 className="text-lg font-semibold text-gray-800 mb-3">Time Synchronization (NTP)</h3>
                                 <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                                    <li>When the controller is in <strong>Station (STA) Mode</strong> and successfully connected to your Wi-Fi network with internet access, it will automatically attempt to synchronize its internal clock using NTP (Network Time Protocol).</li>
                                    <li>Synchronization typically occurs shortly after boot and periodically (e.g., every 6 hours).</li>
                                    <li>The correct <strong>Timezone Offset</strong> must be set in the Parameters/Settings for the displayed time to be accurate for your location.</li>
                                    <li>If NTP sync is successful, the LCD/Web UI will show the current time (if Display Mode is set to Time). Otherwise, it may show dashes or revert to showing Runtime.</li>
                                    <li>Time sync does not occur in AP Mode.</li>
                                 </ul>
                              </div>
                         </div>
                       </section>
                    )}

                    {/* --- 11. Troubleshooting --- */}
                    {activeSection === 'troubleshooting' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">11. Troubleshooting Guide</h2>
                        <p className="mb-6 text-gray-600">Common issues and potential solutions.</p>
                        <div className="border rounded-lg p-4 shadow-sm space-y-4">
                          {/* --- Web UI / Connection --- */}
                          <div><p className="font-semibold text-gray-800">Issue: Cannot connect to Web Interface in AP Mode.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Ensure you're connected to the correct Wi‑Fi SSID (matches Serial ID). Verify password (<code>PASSWORD</code>). Try manually navigating to <code>http://192.168.4.1</code>. Forget the network on your device and reconnect. Restart controller and connecting device.</p></div> <hr />
                          <div><p className="font-semibold text-gray-800">Issue: Controller keeps reverting to AP Mode after configuring STA Mode.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Explanation:</strong> This happens after 3 failed attempts to connect to the specified STA network. <br/><strong>Solutions:</strong> Double-check the STA SSID and Password in Settings (case-sensitive). Ensure the target network is 2.4GHz and within range. Check if the router uses MAC filtering. Reconfigure settings via AP mode.</p></div> <hr />
                          <div><p className="font-semibold text-gray-800">Issue: Web Control page buttons or pause toggle unresponsive.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Check the connection status indicator at the top right (should show "Connected"). Verify WebSocket connection in browser developer console (F12). Ensure you have the required PIN level (Tech) for the Control tab. Refresh the page. Restart the controller.</p></div> <hr />
                          {/* --- LCD --- */}
                           <div><p className="font-semibold text-gray-800">Issue: LCD screen is blank or garbled.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Check power supply to the controller. Verify LCD contrast (if adjustable). Check I2C wiring (SDA, SCL, VCC, GND) between ESP32 and LCD module. Ensure correct I2C address (<code>0x27</code> or <code>0x3F</code>) is used in firmware.</p></div> <hr />
                           <div><p className="font-semibold text-gray-800">Issue: LCD buttons are unresponsive.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Check wiring for each button (GPIO 34, 35, 33, 27) to GND. Ensure internal pullups are working or external pullups are present if needed. Test button continuity with a multimeter.</p></div> <hr />
                          {/* --- Operation / Dosing --- */}
                          <div><p className="font-semibold text-gray-800">Issue: "NO_FLOW" or "LOW_FLOW" error persists despite water flowing.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Verify flow meter wiring to ADC input (Pin A1 on ADS1115). Ensure meter impeller spins freely. Recalibrate the Flow Sensor (Min/Max Raw ADC values and Max Flow Rate). Check if the minimum raw ADC value corresponds accurately to zero flow.</p></div> <hr />
                          <div><p className="font-semibold text-gray-800">Issue: Pump not dosing or dosing incorrectly.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Check for active errors (<code>SYSTEM_PAUSED</code>, <code>PUMP_ALARM</code>, <code>NO_FLOW</code>) on LCD/Web UI. Verify 4-20mA wiring for Chem pump. Recalibrate Chem Pump DAC (4mA and 20mA points). Check Chem Pump Weight (GPH) setting. For acid pump: verify trigger wiring (Pin 6 on MCP23017), check Acid Stroke Volume and Product:Acid Ratio settings. Check for <code>MISWEIGHTED</code> warning.</p></div> <hr />
                           <div><p className="font-semibold text-gray-800">Issue: Web Pause doesn't unpause the system.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Ensure the physical Pause Switch (Pin 9 on MCP23017) is in the RUN position (LOW). Check for other active errors like <code>PUMP_ALARM</code> or <code>NO_FLOW</code>. Verify WebSocket connection is active. Check Serial Monitor/JS console logs for errors during the `PAUSE_OFF` command sequence.</p></div> <hr />
                          {/* --- Calibration / Readings --- */}
                          <div><p className="font-semibold text-gray-800">Issue: Inaccurate probe readings (pH, ORP, ClO2).</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Ensure correct Probe Type is selected in Calibration. Verify probe wiring to ADC inputs (Probe 1=A0, Probe 2=A2 on ADS1115). Clean the probe according to manufacturer instructions. Recalibrate using fresh, certified standard solutions. Double-check Raw ADC and Engineering values entered during calibration (Low < High).</p></div> <hr />
                          {/* --- Security / Reset --- */}
                          <div><p className="font-semibold text-gray-800">Issue: Forgot PIN / Locked out.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solution:</strong> Perform a Factory Reset. Access requires the Master PIN (<code>9999</code> default). Go to Web UI → Settings → System Reset, enter Master PIN, and confirm. This resets all PINs to default (1111, 2222, 9999) and restarts the device. If Master PIN is also forgotten, the only option is to reflash the firmware via USB, which will typically reset EEPROM/settings.</p></div> <hr/>
                           {/* --- Cloudflare --- */}
                           <div><p className="font-semibold text-gray-800">Issue: Cloudflare connection test fails or emails/uploads don't work.</p><p className="text-sm text-gray-600 mt-1 pl-4"><strong>Solutions:</strong> Ensure controller is in STA mode and connected to Wi-Fi with internet access. Verify the Cloudflare Worker endpoint URL is correct in firmware. Double-check the API Key entered in Web UI settings. Ensure the worker script is deployed correctly on Cloudflare and active. Check recipient email addresses for typos. Test connection/email via Web UI buttons.</p></div>
                        </div>

                        {/* Debugging Tools */}
                        <div className="border rounded-lg p-4 shadow-sm mt-6">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3">Debugging Tools</h3>
                          <ul className="list-disc pl-5 text-sm text-gray-600 space-y-1">
                            <li><strong>Web UI Debug Console:</strong> In your browser, press <code>Ctrl + Shift + D</code> (or Cmd+Option+D on Mac) to toggle a live console showing WebSocket messages and JS logs.</li>
                            <li><strong>Diagnostics Endpoint:</strong> Navigate to <code>/diag</code> on the controller's IP/mDNS address for a plain text status summary.</li>
                            <li><strong>Serial Monitor:</strong> Connect via USB cable and use a serial terminal (like Arduino IDE Serial Monitor, Putty, CoolTerm) at 115200 baud rate to view detailed boot messages, debug logs, and error outputs.</li>
                            <li><strong>LCD Display:</strong> Check the Home Screen for error messages and the various Status menus for detailed readings.</li>
                          </ul>
                        </div>
                      </section>
                    )}

                      </section>
                    )}

                    {/* Footer */}
                    <div className="mt-10 pt-6 border-t border-gray-200 text-center text-xs text-gray-500">

                    </div>
                  </div>
                </main>

            </div>
          </div>
        );
