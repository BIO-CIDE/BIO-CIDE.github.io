<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDIE Controller Setup Instructions</title>
    <!-- Tailwind CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      /* Base typography */
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue', sans-serif;
      }
      /* Code block styling */
      code {
        background-color: #e5e7eb; /* gray-200 */
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9em;
      }
      /* SVG icon sizing */
      .icon {
        display: inline-block;
        width: 1.25em;
        height: 1.25em;
        margin-right: 0.5em;
        vertical-align: text-bottom;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React and ReactDOM -->
    <script
      src="https://unpkg.com/react@17/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      "use strict";

      const { useState } = React;

      //
      // Icon components
      //
      const WifiIcon = () => (
        <svg
          className="icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.394 9.393a15 15 0 0121.213 0"
          ></path>
        </svg>
      );
      const SettingsIcon = () => (
        <svg
          className="icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          ></path>
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          ></path>
        </svg>
      );
      const WarningIcon = () => (
        <svg className="icon text-red-500" viewBox="0 0 20 20" fill="currentColor">
          <path
            fillRule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
            clipRule="evenodd"
          ></path>
        </svg>
      );
      const InfoIcon = () => (
        <svg className="icon text-blue-500" viewBox="0 0 20 20" fill="currentColor">
          <path
            fillRule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
            clipRule="evenodd"
          ></path>
        </svg>
      );

      //
      // Main component
      //
      const EdieControllerInstructions = () => {
        const [activeSection, setActiveSection] = useState('initial');

        const sections = [
          { id: 'initial', title: 'Initial Connection' },
          { id: 'setup', title: 'Basic Setup' },
          { id: 'calibration', title: 'Calibration' },
          { id: 'serialId', title: 'Changing Serial ID' },
          { id: 'data', title: 'Data Management' },
          { id: 'hardware', title: 'Hardware Connections' },
          { id: 'operation', title: 'Operation Notes' },
          { id: 'troubleshooting', title: 'Troubleshooting' },
          { id: 'known', title: 'Known Issues' }
        ];

        return (
          <div className="bg-gray-100 min-h-screen">
            {/* Header */}
            <header className="bg-gradient-to-r from-blue-700 to-blue-900 text-white p-6 shadow-lg relative">
              <div className="absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full shadow-sm font-semibold tracking-wide">
                BETA
              </div>
              <h1 className="text-4xl font-bold">EDIE Controller</h1>
              <p className="mt-1 text-blue-200">Setup, Calibration, and Operation Guide</p>
            </header>

            <div className="container mx-auto p-6">
              {/* Beta advisory */}
              <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-8 rounded-r-lg shadow-md" role="alert">
                <div className="flex items-center">
                  <WarningIcon />
                  <div>
                    <p className="font-bold">BETA STATUS ADVISORY</p>
                    <p>
                      This controller firmware is under active development. Core functionality and safety features are implemented,
                      but advanced features may be unstable or incomplete. Always verify system operation and monitor dosing independently.
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex flex-col lg:flex-row gap-8">
                {/* Navigation Sidebar */}
                <nav className="lg:w-1/4">
                  <div className="bg-white rounded-lg shadow-lg p-4 sticky top-6">
                    <h2 className="text-xl font-bold mb-4 text-blue-800 border-b border-gray-200 pb-2">Navigation</h2>
                    <ul className="space-y-1">
                      {sections.map((section) => (
                        <li key={section.id}>
                          <button
                            onClick={() => setActiveSection(section.id)}
                            className={`w-full text-left p-3 rounded-md hover:bg-blue-100 hover:text-blue-800 transition-colors duration-150 ${
                              activeSection === section.id ? 'bg-blue-600 text-white font-semibold shadow-sm' : 'text-gray-700'
                            }`}
                          >
                            {section.title}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                </nav>

                {/* Main Content */}
                <main className="lg:w-3/4">
                  <div className="bg-white rounded-lg shadow-lg p-6 md:p-8">
                    {activeSection === 'initial' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">1. Initial Connection & Access</h2>
                        <div className="space-y-6">
                          {/* Step 1 */}
                          <div className="prose max-w-none">
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-blue-600 mr-3">①</span> Power Up
                            </h3>
                            <p>
                              Connect the controller to a suitable power source. The LCD will display “EDIE Controller”,
                              followed by its Serial ID (e.g., <code>EM1001</code>) and “Initializing…”.
                            </p>
                          </div>

                          {/* Step 2 */}
                          <div className="prose max-w-none">
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-blue-600 mr-3">②</span> Connect via Wi‑Fi (AP Mode)
                            </h3>
                            <p>By default, the controller starts in Access Point (AP) mode. Use your device to:</p>
                            <ul className="list-disc pl-5 space-y-1">
                              <li>Scan for Wi‑Fi networks.</li>
                              <li>Find the network named after the controller’s <strong>Serial ID</strong> (Default: <code>EM1001</code>).</li>
                              <li>Connect using the default password: <code>PASSWORD</code> (case‑sensitive).</li>
                            </ul>
                          </div>

                          {/* Step 3 */}
                          <div className="prose max-w-none">
                            <h3 className="text-lg font-semibold text-gray-800 flex items-center">
                              <span className="text-3xl font-bold text-blue-600 mr-3">③</span> Access the Web Interface (Captive Portal)
                            </h3>
                            <p>Once connected to the controller’s Wi‑Fi:</p>
                            <ul className="list-disc pl-5 space-y-1">
                              <li>Open a web browser (Chrome, Firefox, Safari).</li>
                              <li>Navigate to any external site (e.g., <code>http://google.com</code>); you’ll be redirected.</li>
                              <li>If not, go to <code>http://192.168.4.1</code> manually.</li>
                              <li>Or use mDNS: <code>http://EM1001.local</code>.</li>
                            </ul>
                          </div>

                          {/* Quick Reference */}
                          <div className="bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-sm">
                            <h4 className="font-semibold text-blue-700 flex items-center">
                              <InfoIcon /> Default PINs (Passwords)
                            </h4>
                            <p className="text-sm text-gray-600 mb-2">
                              Initial 4‑digit PINs to access protected web sections:
                            </p>
                            <ul className="mt-1 space-y-1 text-sm">
                              <li><strong>User Level PIN:</strong> <code>1111</code></li>
                              <li><strong>Tech Level PIN:</strong> <code>2222</code></li>
                              <li><strong>Master Level PIN:</strong> <code>9999</code></li>
                            </ul>
                            <p className="mt-2 text-xs text-gray-500">
                              Strongly recommended to change these in Settings.
                            </p>
                          </div>
                        </div>
                      </section>
                    )}

                    {activeSection === 'setup' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">2. Basic Setup Configuration</h2>
                        <p className="mb-6 text-gray-600">
                          Configure core operational parameters and network settings.
                        </p>

                        {/* System Parameters */}
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                            <SettingsIcon /> System Parameters
                            <span className="text-sm font-normal text-gray-500 ml-2">(User PIN: <code>1111</code>)</span>
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">
                            In Parameters tab, enter User PIN and adjust:
                          </p>
                          <div className="overflow-x-auto">
                            <table className="min-w-full border border-gray-200 text-sm">
                              <thead className="bg-gray-100">
                                <tr>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">Parameter</th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">Description</th>
                                  <th className="px-4 py-2 border text-left font-semibold text-gray-600">Typical Range</th>
                                </tr>
                              </thead>
                              <tbody className="bg-white">
                                <tr>
                                  <td className="px-4 py-2 border font-medium">Desired PPM</td>
                                  <td className="px-4 py-2 border">Target chemical concentration</td>
                                  <td className="px-4 py-2 border"><code>3</code> – <code>500</code></td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border font-medium">Product Selection</td>
                                  <td className="px-4 py-2 border">Choose chemical product</td>
                                  <td className="px-4 py-2 border">List (PRO-OXINE, etc.)</td>
                                </tr>
                                <tr>
                                  <td className="px-4 py-2 border font-medium">Product Acid Ratio</td>
                                  <td className="px-4 py-2 border">Chem:Acid ratio (e.g., 5.0 = 5 parts Chem to 1 part Acid)</td>
                                  <td className="px-4 py-2 border"><code>0.1</code> – <code>50.0</code></td>
                                </tr>
                                <tr className="bg-gray-50">
                                  <td className="px-4 py-2 border font-medium">Chem Pump Weight</td>
                                  <td className="px-4 py-2 border">Max pump capacity (GPH)</td>
                                  <td className="px-4 py-2 border"><code>0.1</code> – <code>10.0</code></td>
                                </tr>
                                <tr>
                                  <td className="px-4 py-2 border font-medium">Acid Stroke Volume</td>
                                  <td className="px-4 py-2 border">Volume per acid pump pulse (mL)</td>
                                  <td className="px-4 py-2 border"><code>0.01</code> – <code>20.0</code></td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save Parameters
                          </button>
                        </div>

                        {/* Network & Security */}
                        <div className="border rounded-lg p-4 shadow-sm">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3 flex items-center">
                            <WifiIcon /> Network & Security
                            <span className="text-sm font-normal text-gray-500 ml-2">(Tech PIN: <code>2222</code> / Master PIN: <code>9999</code>)</span>
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">
                            In Settings tab, enter Tech or Master PIN.
                          </p>

                          {/* AP vs STA modes */}
                          <div className="space-y-4 mb-4">
                            <div>
                              <h4 className="font-medium text-gray-700">Network Configuration</h4>
                              <ul className="list-disc pl-5 text-sm text-gray-600 mt-2 space-y-1">
                                <li><strong>Access Point (AP) Mode:</strong>
                                  <ul className="list-circle pl-5 text-xs">
                                    <li>Controller creates its own Wi‑Fi network.</li>
                                    <li>SSID = Serial ID.</li>
                                    <li>Set secure password (default: <code>PASSWORD</code>).</li>
                                  </ul>
                                </li>
                                <li><strong>Station (STA) Mode:</strong>
                                  <ul className="list-circle pl-5 text-xs">
                                    <li>Controller joins existing network.</li>
                                    <li>Enter your SSID & password.</li>
                                  </ul>
                                </li>
                                <li>Enter Master PIN (<code>9999</code>) to save changes.</li>
                                <li><strong className="text-red-600">Important:</strong> Saving restarts the controller; reconnect afterwards.</li>
                              </ul>
                              <button className="mt-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                                Save Network Settings
                              </button>
                            </div>

                            <div>
                              <h4 className="font-medium text-gray-700">Change Security PINs</h4>
                              <ul className="list-disc pl-5 text-sm text-gray-600 mt-2 space-y-1">
                                <li>Change User, Tech, Master PINs here.</li>
                                <li>Enter current Master PIN (<code>9999</code>) to authorize.</li>
                                <li>Enter new 4‑digit PIN and confirm.</li>
                                <li>Master PIN cannot be <code>0000</code>.</li>
                              </ul>
                              <button className="mt-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                                Save Security PINs
                              </button>
                            </div>
                          </div>
                        </div>
                      </section>
                    )}

                    {activeSection === 'calibration' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">
                          3. Sensor & Output Calibration
                        </h2>
                        <p className="mb-6 text-gray-600">
                          Accurate calibration is crucial. In Calibration tab (Tech PIN: <code>2222</code>).
                        </p>

                        {/* Flow Sensor Calibration */}
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3">Flow Sensor Calibration</h3>
                          <p className="text-sm text-gray-600 mb-4">
                            Ensure flow meter is installed and water flows at known rates.
                          </p>
                          <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                            <li>
                              <strong>Set Max Flow Rate (GPM):</strong> Enter highest expected flow (e.g., <code>100</code>).
                            </li>
                            <li>
                              <strong>Set Min Calibrate Flow (Raw):</strong> Run at lowest flow, note "Raw ADC", enter value.
                            </li>
                            <li>
                              <strong>Set Max Calibrate Flow (Raw):</strong> Run at highest flow, note "Raw ADC", enter value.
                            </li>
                          </ul>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save Flow Calibration
                          </button>
                        </div>

                        {/* DAC Output Calibration */}
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3">
                            DAC (4-20mA / 0-20mA) Output Calibration
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">
                            Calibrate analog outputs. Use a multimeter capable of measuring mA.
                          </p>
                          <div className="space-y-3 text-sm">
                            <p><strong>Chem Pump (Ch0) / Flow Mirror (Ch2) - 4-20mA:</strong></p>
                            <ul className="list-disc pl-5 text-gray-600 space-y-1">
                              <li>Connect meter in series with output.</li>
                              <li>Click "Test 4mA", adjust "DAC Value for 4mA" until meter reads 4.0mA.</li>
                              <li>Click "Test 20mA", adjust "DAC Value for 20mA" until meter reads 20.0mA.</li>
                              <li>Click "Stop Test" between adjustments.</li>
                            </ul>
                            <p><strong>PPM Output (Ch3) - 0-20mA:</strong></p>
                            <ul className="list-disc pl-5 text-gray-600 space-y-1">
                              <li>Connect meter in series with Ch3 output.</li>
                              <li>Click "Test 0mA", adjust "DAC Value for 0mA" until meter reads 0.0mA.</li>
                              <li>Click "Test 20mA", adjust "DAC Value for 20mA" until meter reads 20.0mA.</li>
                              <li>Set PPM values: 0 PPM at 0mA, 20 PPM at 20mA.</li>
                              <li>Click "Stop Test" between adjustments.</li>
                            </ul>
                          </div>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save All DAC Calibration
                          </button>
                        </div>

                        {/* Probe Calibration */}
                        <div className="border rounded-lg p-4 shadow-sm mb-8">
                          <h3 className="text-lg font-semibold text-gray-800 mb-3">
                            Probe Calibration (Probe One / Probe Two)
                          </h3>
                          <p className="text-sm text-gray-600 mb-4">
                            Calibrate analog probes (pH, ORP, ClO2, etc.). Use certified solutions.
                          </p>
                          <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                            <li>
                              <strong>Select Probe Type:</strong> pH, ORP, ClO2, Other, None. Default ranges load.
                            </li>
                            <li>
                              <strong>Set Cal Low (Raw) & Low Eng Value:</strong> Place in low standard, note "Raw ADC", enter it. Enter known low value.
                            </li>
                            <li>
                              <strong>Set Cal High (Raw) & High Eng Value:</strong> Place in high standard, note "Raw ADC", enter it. Enter known high value.
                            </li>
                            <li>
                              Ensure Low Eng Value {'<'} High Eng Value and Low Raw {'<'} High Raw.
                            </li>
                          </ul>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors mr-2">
                            Save Probe One Cal
                          </button>
                          <button className="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded transition-colors">
                            Save Probe Two Cal
                          </button>
                        </div>

                        {/* Calibration Tips */}
                        <div className="bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-sm">
                          <h4 className="font-semibold text-blue-700 flex items-center">
                            <InfoIcon /> Calibration Tips
                          </h4>
                          <ul className="mt-2 space-y-1 text-sm text-gray-700 list-disc list-inside">
                            <li>Allow sensors to stabilize before readings.</li>
                            <li>Use certified standards for probes.</li>
                            <li>Use accurate flow meter or timed fill for flow calibration.</li>
                            <li>Verify DAC ranges with a calibrated multimeter.</li>
                            <li>Document final calibration values.</li>
                          </ul>
                        </div>
                      </section>
                    )}

                    {activeSection === 'serialId' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">
                          4. Changing the Device Serial ID
                        </h2>
                        <p className="mb-6 text-gray-600">
                          Changing the Serial ID affects network and logs. (Master PIN: <code>9999</code>)
                        </p>

                        <div className="space-y-6">
                          <div className="border rounded-lg p-4 shadow-sm mb-4">
                            <h3 className="text-lg font-semibold text-gray-800 mb-3">Procedure</h3>
                            <ol className="list-decimal pl-5 text-sm text-gray-600 space-y-2">
                              <li>Go to Settings tab.</li>
                              <li>Enter Master PIN (<code>9999</code>).</li>
                              <li>Locate “Device Serial ID” section.</li>
                              <li>
                                Enter new Serial ID (3–16 chars; letters, numbers, hyphens, underscores).
                              </li>
                              <li>Enter Verification Code: <code>1123</code>.</li>
                              <li>Re-enter Master PIN.</li>
                              <li>
                                Click <span className="font-medium text-red-600">Update Serial ID & Restart</span>.
                              </li>
                            </ol>
                          </div>

                          {/* Important consequences */}
                          <div className="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-r-lg shadow-md" role="alert">
                            <div className="flex items-center">
                              <svg className="icon text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 3.001-1.742 3.001H4.42c-1.53 0-2.493-1.667-1.743-3.001l5.58-9.92zM10 13a1 1 0 110-2 1 1 0 010 2zm-1.75-5.75a.75.75 0 001.5 0v-2.5a.75.75 0 00-1.5 0v2.5z" clipRule="evenodd" />
                              </svg>
                              <div className="ml-3">
                                <p className="font-bold">Important Consequences of Changing Serial ID:</p>
                                <ul className="list-disc pl-5 text-sm mt-1">
                                  <li>Controller will restart immediately.</li>
                                  <li>AP Mode SSID changes to new Serial ID; reconnect required.</li>
                                  <li>mDNS address changes (<code>http://[new-id].local</code>).</li>
                                  <li>Future logs use the new Serial ID.</li>
                                </ul>
                              </div>
                            </div>
                          </div>
                        </div>
                      </section>
                    )}

                    {activeSection === 'data' && (
                      <section>
                        <h2 className="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">
                          5. Data Logging & Management
                        </h2>
                        <p className="mb-6 text-gray-600">
                          Logs operational data. In History tab (User PIN: <code>1111</code>, Tech PIN: <code>2222</code>).
                        </p>

                        {/* Data Storage */}
                        <div className="border rounded-lg p-4 shadow-sm mb-4">
