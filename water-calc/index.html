<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Water Consumption Calculator</title>
    <!-- Tailwind CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- PropTypes for Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <!-- Recharts for graphs -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <!-- Babel for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9fafb;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        .custom-tooltip {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
        }

        .collapse-content.show {
            max-height: 500px; /* Adjust as needed */
        }

        /* Custom styles for the range input */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            outline: none;
            transition: background-color 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar } = Recharts;

    const speciesDefinitions = {
        poultry: {
            houseName: "House",
            subspeciesName: "Poultry",
            subspecies: [
                { name: "Broilers", waterPerDay: [0.008, 0.15], cycleWeeks: 8, color: "#8C8C8C" },
                { name: "Layers", waterPerDay: [0.008, 0.1], cycleWeeks: 35, color: "#87A96B" },
                { name: "Pullets", waterPerDay: [0.008, 0.15], cycleWeeks: 18, color: "#6A5ACD" },
                { name: "Brooders", waterPerDay: [0.075, 0.10], cycleWeeks: 4, color: "#D2691E" },
                { name: "Turkeys", waterPerDay: [0.02, 0.283], cycleWeeks: 22, color: "#9B59B6" }
            ]
        },
		swine: {
			houseName: "Barn",
			subspeciesName: "Pig",
			subspecies: [
				{ name: "Sow", waterPerDay: [0.35, 9.9], cycleWeeks: 19, color: "#FF6347" },
				{ name: "Nursery", waterPerDay: [0.07, 0.9], cycleWeeks: 9, color: "#4682B4" },
				{ name: "Grow-Finish", waterPerDay: [0.14, 4.0], cycleWeeks: 28, color: "#32CD32" }
			]
		}
    };

    const References = () => {
        const [isOpen, setIsOpen] = useState(false);

        const toggle = () => setIsOpen(!isOpen);

        return (
            <div className="mt-8">
                <button
                    onClick={toggle}
                    className="w-full bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500"
                >
                    {isOpen ? 'Hide References' : 'Show References'}
                </button>
                <div className={`collapse-content ${isOpen ? 'show' : ''}`}>
                    <ul className="list-disc ml-6 mt-4 space-y-2">
                        <li><a href="https://www.veterinariadigital.com/en/articulos/water-quality-in-poultry-production/" target="_blank" className="text-blue-600 hover:underline">Water Quality in Poultry Production</a> - Veterinaria Digital</li>
                        <li><a href="https://extension.uga.edu/publications/detail.html?number=B1301&title=poultry-drinking-water-primer" target="_blank" className="text-blue-600 hover:underline">Poultry Drinking Water Primer</a> - University of Georgia Extension</li>
                        <li><a href="https://www.hybridturkeys.com/documents/513/WATER_CONSUMPTION_CARD_8.5x11_HYBRID_US_Print_2020.pdf" target="_blank" className="text-blue-600 hover:underline">Water Consumption Card</a> - Hybrid Turkeys</li>
                        <li><a href="https://www.poultrymed.com/Poultrymed/Templates/showpage.asp?DBID=1&LNGID=1&TMID=84&FID=1624" target="_blank" className="text-blue-600 hover:underline">Poultry Water Consumption</a> - PoultryMed</li>
                    </ul>
                </div>
            </div>
        );
    };

    const WaterConsumptionCalculator = () => {
        const [animalType, setAnimalType] = useState("poultry");
        const [selectedSubspeciesName, setSelectedSubspeciesName] = useState(speciesDefinitions.poultry.subspecies[0].name);
        const [durationWeeks, setDurationWeeks] = useState(speciesDefinitions.poultry.subspecies[0].cycleWeeks);
        const [temperature, setTemperature] = useState(75);
        const [numberOfAnimals, setNumberOfAnimals] = useState(12500);
        const [houseCount, setHouseCount] = useState(1);
        const [extendGrowth, setExtendGrowth] = useState(false);
        const [processingAge, setProcessingAge] = useState(speciesDefinitions.poultry.subspecies[0].cycleWeeks);

        const selectedSpeciesData = speciesDefinitions[animalType];
        const selectedSubspeciesData = useMemo(() => 
            selectedSpeciesData.subspecies.find(sub => sub.name === selectedSubspeciesName),
            [animalType, selectedSubspeciesName]
        );

        // Update subspecies and reset defaults when animal type changes
        useEffect(() => {
            const defaultSubspecies = speciesDefinitions[animalType].subspecies[0];
            setSelectedSubspeciesName(defaultSubspecies.name);
            setProcessingAge(defaultSubspecies.cycleWeeks);
            setDurationWeeks(defaultSubspecies.cycleWeeks);
        }, [animalType]);

        const handleSubspeciesChange = (e) => {
            const newSubspeciesName = e.target.value;
            const subspecies = selectedSpeciesData.subspecies.find(sub => sub.name === newSubspeciesName);
            setSelectedSubspeciesName(newSubspeciesName);
            setProcessingAge(subspecies.cycleWeeks);
            setDurationWeeks(subspecies.cycleWeeks);
        };
        
        const resetToDefaults = () => {
            if (selectedSubspeciesData) {
                setProcessingAge(selectedSubspeciesData.cycleWeeks);
                setDurationWeeks(selectedSubspeciesData.cycleWeeks);
                setTemperature(75);
                setExtendGrowth(false);
            }
        };

        const growthStageLimits = useMemo(() => {
            if (!selectedSubspeciesData) return { min: 1, max: 52, default: 8 };
            return {
                min: Math.floor(selectedSubspeciesData.cycleWeeks * 0.5),
                max: Math.ceil(selectedSubspeciesData.cycleWeeks * 1.5)
            };
        }, [selectedSubspeciesData]);

        const calculateTemperatureMultiplier = (temp) => {
            if (temp <= 32) return 0.8;
            if (temp >= 100) return 1.6;
            if (temp <= 50) return 0.8 + (temp - 32) * (0.2 / 18);
            return 1.0 + (temp - 50) * (0.6 / 50);
        };

        const calculateExponentialConsumption = (day, cycleLength, steepness, tempMultiplier) => {
            if (!selectedSubspeciesData) return 0;
            const { waterPerDay } = selectedSubspeciesData;
            const adjustedMinWater = waterPerDay[0] * numberOfAnimals * houseCount * tempMultiplier;
            const adjustedMaxWater = waterPerDay[1] * numberOfAnimals * houseCount * tempMultiplier;
            const t = Math.pow((day % cycleLength + 1) / cycleLength, steepness);
            return Math.round(adjustedMinWater + (adjustedMaxWater - adjustedMinWater) * t);
        };

        const waterConsumptionData = useMemo(() => {
            const data = [];
            let cumulativeConsumption = 0;
            const steepness = 1.8;
            const tempMultiplier = calculateTemperatureMultiplier(temperature);
            const cycleDays = processingAge * 7;

            for (let i = 1; i <= durationWeeks * 7; i++) {
                const dailyConsumption = calculateExponentialConsumption(i, cycleDays, steepness, tempMultiplier);
                cumulativeConsumption += dailyConsumption;
                data.push({
                    day: i,
                    week: Math.ceil(i / 7),
                    biweek: Math.ceil(i / 14),
                    month: Math.ceil(i / 30.44), // More accurate month
                    consumption: dailyConsumption,
                    cumulative: cumulativeConsumption
                });
            }
            return data;
        }, [durationWeeks, processingAge, temperature, numberOfAnimals, houseCount, selectedSubspeciesData]);

        const totalWater = waterConsumptionData.length > 0 ? waterConsumptionData[waterConsumptionData.length - 1].cumulative : 0;

        const timeKey = durationWeeks >= 56 ? "month" : durationWeeks >= 28 ? "biweek" : durationWeeks >= 14 ? "week" : "day";
        
        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const data = payload[0].payload;
                let timeLabel = `Day ${label}`;
                if (timeKey === "week") timeLabel = `Week ${data.week}`;
                if (timeKey === "biweek") timeLabel = `Bi-Week ${data.biweek}`;
                if (timeKey === "month") timeLabel = `Month ${Math.ceil(data.month)}`;

                return (
                    <div className="custom-tooltip">
                        <p className="label font-semibold">{timeLabel}</p>
                        <p>{`Cumulative: ${data.cumulative.toLocaleString()} Gallons`}</p>
                        <p>{`Daily: ${data.consumption.toLocaleString()} Gallons`}</p>
                    </div>
                );
            }
            return null;
        };

        const themeColor = selectedSubspeciesData?.color || '#3b82f6';

        return (
            <div className="p-4 sm:p-6 md:p-8 bg-white shadow-xl rounded-2xl max-w-5xl mx-auto">
                <h1 className="text-3xl sm:text-4xl font-bold mb-6 text-center text-gray-800">
                    Advanced Water Consumption Calculator
                </h1>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {/* Input Fields */}
                    <div className="input-field">
                        <label htmlFor="species" className="block text-lg font-semibold mb-2 text-gray-700">Species</label>
                        <select id="species" className="p-3 border border-gray-300 rounded-lg w-full focus:ring-2 focus:ring-blue-500" value={animalType} onChange={(e) => setAnimalType(e.target.value)}>
                            <option value="poultry">Poultry</option>
                            <option value="swine">Swine</option>
                        </select>
                    </div>
                    <div className="input-field">
                        <label htmlFor="subspecies" className="block text-lg font-semibold mb-2 text-gray-700">Subspecies</label>
                        <select id="subspecies" className="p-3 border border-gray-300 rounded-lg w-full focus:ring-2" value={selectedSubspeciesName} onChange={handleSubspeciesChange} style={{ backgroundColor: themeColor, color: '#fff', 'WebkitAppearance': 'none' }}>
                            {selectedSpeciesData.subspecies.map(sub => <option key={sub.name} value={sub.name} style={{ backgroundColor: '#fff', color: '#000' }}>{sub.name}</option>)}
                        </select>
                    </div>
                    <div className="input-field">
                        <label htmlFor="numAnimals" className="block text-lg font-semibold mb-2 text-gray-700">{selectedSpeciesData.subspeciesName} per {selectedSpeciesData.houseName}</label>
                        <input id="numAnimals" type="number" value={numberOfAnimals} onChange={(e) => setNumberOfAnimals(Number(e.target.value))} className="p-3 border border-gray-300 rounded-lg w-full focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div className="input-field">
                        <label htmlFor="houseCount" className="block text-lg font-semibold mb-2 text-gray-700">{selectedSpeciesData.houseName}s</label>
                        <input id="houseCount" type="number" value={houseCount} onChange={(e) => setHouseCount(Number(e.target.value))} className="p-3 border border-gray-300 rounded-lg w-full focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div className="input-field">
                        <label htmlFor="temperature" className="block text-lg font-semibold mb-2 text-gray-700">Temperature (°F)</label>
                        <input id="temperature" type="number" value={temperature} onChange={(e) => setTemperature(Number(e.target.value))} className="p-3 border border-gray-300 rounded-lg w-full focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div className="input-field">
                        <label htmlFor="processingAge" className="block text-lg font-semibold mb-2 text-gray-700">Processing Age (Weeks)</label>
                        <input id="processingAge" type="number" value={processingAge} onChange={(e) => setProcessingAge(Number(e.target.value))} className="p-3 border border-gray-300 rounded-lg w-full focus:ring-2 focus:ring-blue-500" />
                    </div>
                </div>
                
                <div className="mt-8">
                    <label htmlFor="duration" className="block text-lg font-semibold mb-2 text-gray-700">Chart Duration: {durationWeeks} Weeks</label>
                    <input
                        id="duration"
                        type="range"
                        min={growthStageLimits.min}
                        max={extendGrowth ? 208 : growthStageLimits.max}
                        value={durationWeeks}
                        onChange={(e) => setDurationWeeks(Number(e.target.value))}
                        className="w-full"
                        style={{ backgroundColor: themeColor + '40', '--thumb-color': themeColor }}
                    />
                    <style>{`
                        input[type="range"]::-webkit-slider-thumb { background-color: ${themeColor}; }
                        input[type="range"]::-moz-range-thumb { background-color: ${themeColor}; }
                    `}</style>
                    <div className="flex items-center justify-between mt-2">
                        <div className="flex items-center">
                            <input id="extendGrowth" type="checkbox" checked={extendGrowth} onChange={(e) => setExtendGrowth(e.target.checked)} className="mr-2 h-5 w-5 rounded text-blue-600 focus:ring-blue-500"/>
                            <label htmlFor="extendGrowth" className="text-gray-700">Expand to four years</label>
                        </div>
                        <button onClick={resetToDefaults} className="bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400">
                            Reset to Defaults
                        </button>
                    </div>
                </div>

                <div className="mt-8">
                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Cumulative Water Consumption</h2>
                    <ResponsiveContainer width="100%" height={400}>
                        <LineChart data={waterConsumptionData} margin={{ top: 20, right: 30, left: 20, bottom: 20 }}>
                            <CartesianGrid strokeDasharray="3 3" />
                            <XAxis dataKey={timeKey} label={{ value: timeKey.charAt(0).toUpperCase() + timeKey.slice(1) + 's', position: 'insideBottom', offset: -15 }} />
                            <YAxis tickFormatter={val => val.toLocaleString()} label={{ value: 'Gallons', angle: -90, position: 'insideLeft' }} />
                            <Tooltip content={<CustomTooltip />} />
                            <Line type="monotone" dataKey="cumulative" stroke={themeColor} strokeWidth={3} dot={false} />
                        </LineChart>
                    </ResponsiveContainer>
                </div>

                <div className="mt-8">
                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Daily Water Consumption</h2>
                    <ResponsiveContainer width="100%" height={200}>
                        <BarChart data={waterConsumptionData} margin={{ top: 20, right: 30, left: 20, bottom: 20 }}>
                            <CartesianGrid strokeDasharray="3 3" />
                            <XAxis dataKey={timeKey} label={{ value: timeKey.charAt(0).toUpperCase() + timeKey.slice(1) + 's', position: 'insideBottom', offset: -15 }} />
                            <YAxis tickFormatter={val => val.toLocaleString()} />
                            <Tooltip content={<CustomTooltip />} />
                            <Bar dataKey="consumption" fill={themeColor} />
                        </BarChart>
                    </ResponsiveContainer>
                </div>
                
                <div className="mt-8 text-right text-2xl font-bold text-gray-800">
                    Total Water Consumption: {totalWater.toLocaleString()} Gallons
                </div>
                
                <References />

            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WaterConsumptionCalculator />);
</script>

</body>
</html>
