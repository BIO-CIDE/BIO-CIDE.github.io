<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Consumption Calculator</title>
    <!-- Tailwind CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Recharts for graphs (loaded before your script) -->
    <script src="https://unpkg.com/recharts@2.1.14/umd/Recharts.min.js"></script>

    <!-- Babel for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .custom-tooltip {
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    
    // --- FIX IS HERE ---
    // Destructure components directly from the global window.Recharts object
    // This ensures you are accessing it after it has been loaded.
    const {
        LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar
    } = window.Recharts;

    const speciesDefinitions = {
        poultry: {
            houseName: "House",
            subspeciesName: "Poultry",
            subspecies: [
                { name: "Broilers", waterPerDay: [0.008, 0.15], cycleWeeks: 8, color: "#8C8C8C" },
                { name: "Layers", waterPerDay: [0.008, 0.1], cycleWeeks: 35, color: "#87A96B" },
                { name: "Pullets", waterPerDay: [0.008, 0.15], cycleWeeks: 18, color: "#6A5ACD" },
                { name: "Brooders", waterPerDay: [0.075, 0.10], cycleWeeks: 4, color: "#D2691E" },
                { name: "Turkeys", waterPerDay: [0.02, 0.283], cycleWeeks: 22, color: "#9B59B6" }
            ]
        },
		swine: {
			houseName: "Barn",
			subspeciesName: "Pig",
			subspecies: [
				{ name: "Sow", waterPerDay: [0.35, 9.9], cycleWeeks: 19, color: "#FF6347" },
				{ name: "Nursery", waterPerDay: [0.07, 0.9], cycleWeeks: 9, color: "#4682B4" },
				{ name: "Grow-Finish", waterPerDay: [0.14, 4.0], cycleWeeks: 28, color: "#32CD32" }
			]
		}
    };
    
    // The rest of your component code remains here...
    // I am omitting it for brevity, but you would paste your
    // WaterConsumptionCalculator and ReactDOM.render call here.
    
    const WaterConsumptionCalculator = () => {
        // ... all your existing calculator logic ...
        const [animalType, setAnimalType] = useState("poultry");
        const [selectedSubspecies, setSelectedSubspecies] = useState(speciesDefinitions.poultry.subspecies[0].name);
        const [growthStage, setGrowthStage] = useState(8);
        const [temperature, setTemperature] = useState(75);
        const [numberOfAnimals, setNumberOfAnimals] = useState(12500);
        const [houseCount, setHouseCount] = useState(1);
        const [extendGrowth, setExtendGrowth] = useState(false);
        const [totalWater, setTotalWater] = useState(0);
        const [houseName, setHouseName] = useState(speciesDefinitions.poultry.houseName);
        const [cycleWeeks, setCycleWeeks] = useState(speciesDefinitions.poultry.subspecies[0].cycleWeeks);
        const [processingAge, setProcessingAge] = useState(speciesDefinitions.poultry.subspecies[0].cycleWeeks);
        const [width, setWidth] = useState(window.innerWidth);

        const calculateLabelInterval = () => {
            const maxDays = growthStage * 7;
            if (width > 1024) return Math.ceil(maxDays / 48);
            if (width > 768) return Math.ceil(maxDays / 24);
            return Math.ceil(maxDays / 12);
        };

        const adjustedGrowthStage = (animalType) => {
            const subspecies = speciesDefinitions[animalType].subspecies.find(sub => sub.name === selectedSubspecies);
            if (!subspecies) return { min: 1, max: 1, default: 1 };
            return {
                min: Math.floor(subspecies.cycleWeeks * 0.5),
                max: Math.ceil(subspecies.cycleWeeks * 1.5),
                default: subspecies.cycleWeeks
            };
        };

        const calculateTemperatureMultiplier = (temp) => {
            if (temp <= 32) return 0.8;
            if (temp >= 100) return 1.6;
            if (temp <= 50) {
                const slope = (1.0 - 0.8) / (50 - 32);
                return slope * (temp - 32) + 0.8;
            }
            const slope = (1.6 - 1.0) / (100 - 50);
            return slope * (temp - 50) + 1.0;
        };

        const steepness = 1.8; // Define steepness here to be accessible in useEffect

	    useEffect(() => {
			const subspecies = speciesDefinitions[animalType].subspecies.find(sub => sub.name === selectedSubspecies);
            const currentSubspecies = subspecies || speciesDefinitions[animalType].subspecies[0];

            if (!subspecies) {
                setSelectedSubspecies(currentSubspecies.name);
            }
            
            setProcessingAge(currentSubspecies.cycleWeeks);
            setHouseName(speciesDefinitions[animalType].houseName);
            setCycleWeeks(currentSubspecies.cycleWeeks);
            
            const growthStageDefaults = adjustedGrowthStage(animalType);
			if (!extendGrowth && (growthStage < growthStageDefaults.min || growthStage > growthStageDefaults.max)) {
				setGrowthStage(growthStageDefaults.default);
			}

            const tempMultiplier = calculateTemperatureMultiplier(temperature);
            let cumulativeTotal = 0;
            for (let day = 1; day <= processingAge * 7; day++) {
                cumulativeTotal += calculateExponentialConsumption(day, processingAge * 7, steepness, tempMultiplier);
            }
            setTotalWater(cumulativeTotal);

		}, [animalType, selectedSubspecies, growthStage, numberOfAnimals, houseCount, temperature, extendGrowth]);

        useEffect(() => {
            const handleResize = () => setWidth(window.innerWidth);
            window.addEventListener('resize', handleResize);
            return () => window.removeEventListener('resize', handleResize);
        }, []);

        const handleSubspeciesChange = (e) => {
            const subspecies = speciesDefinitions[animalType].subspecies.find(sub => sub.name === e.target.value);
            setSelectedSubspecies(e.target.value);
            setProcessingAge(subspecies.cycleWeeks); 
            setGrowthStage(subspecies.cycleWeeks);
        };

        const calculateExponentialConsumption = (day, cycleLength, steepness, tempMultiplier) => {
            const subspecies = speciesDefinitions[animalType].subspecies.find(sub => sub.name === selectedSubspecies);
            if (!subspecies) return 0;
            const minWater = subspecies.waterPerDay[0] * numberOfAnimals * houseCount * tempMultiplier;
            const maxWater = subspecies.waterPerDay[1] * numberOfAnimals * houseCount * tempMultiplier;
            const t = Math.pow(((day - 1) % cycleLength + 1) / cycleLength, steepness);
            return Math.round(minWater + (maxWater - minWater) * t);
        };

        const waterConsumptionData = useMemo(() => {
            const data = [];
            let cumulativeConsumption = 0;
            const tempMultiplier = calculateTemperatureMultiplier(temperature);
            for (let i = 1; i <= growthStage * 7; i++) {
                const dailyConsumption = calculateExponentialConsumption(i, processingAge * 7, steepness, tempMultiplier);
                cumulativeConsumption += dailyConsumption;
                data.push({
                    day: i,
                    week: Math.ceil(i / 7),
                    biweek: Math.ceil(i / 14),
                    month: Math.ceil(i / 30),
                    consumption: dailyConsumption,
                    cumulative: cumulativeConsumption
                });
            }
            return data;
        }, [growthStage, processingAge, selectedSubspecies, animalType, numberOfAnimals, houseCount, temperature, steepness]);

        let timeKey = "day";
        if (growthStage >= 56) timeKey = "month";
        else if (growthStage >= 28) timeKey = "biweek";
        else if (growthStage >= 14) timeKey = "week";

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const { consumption, cumulative } = payload[0].payload;
                let timeLabel = `Day ${label}`;
                if (timeKey === "week") timeLabel = `Week ${Math.ceil(label)}`;
                else if (timeKey === "biweek") timeLabel = `Biweekly ${Math.ceil(label)}`;
                else if (timeKey === "month") timeLabel = `Month ${Math.ceil(label)}`;
                return (
                    <div className="custom-tooltip">
                        <p className="label">{timeLabel}</p>
                        <p>{`Cumulative: ${cumulative.toLocaleString()} Gallons`}</p>
                        <p>{`Daily: ${consumption.toLocaleString()} Gallons`}</p>
                    </div>
                );
            }
            return null;
        };

        const themeColor = speciesDefinitions[animalType].subspecies.find(sub => sub.name === selectedSubspecies)?.color || '#FFFFFF';

        return (
            <div className="p-4 sm:p-6 md:p-8 bg-white shadow-lg rounded-lg">
                <h1 className="text-2xl sm:text-3xl font-bold mb-6 text-center text-gray-800">
                    Water Consumption Calculator
                </h1>
                {/* JSX for your calculator UI */}
                {/* This is the same as your original file */}
                <div className="grid grid-cols-2 gap-6">
                    <div className="input-field">
                        <label className="block text-lg font-semibold mb-2">Species</label>
                        <select
                            className="p-2 border border-gray-300 rounded-md w-full"
                            value={animalType}
                            onChange={(e) => setAnimalType(e.target.value)}
                        >
                            <option value="poultry">Poultry</option>
                            <option value="swine">Swine</option>
                        </select>
                    </div>

                    <div className="input-field">
						<label className="block text-lg font-semibold mb-2">Subspecies</label>
						<select
							className="p-2 border border-gray-300 rounded-md w-full"
							value={selectedSubspecies}
							onChange={handleSubspeciesChange}
							style={{ backgroundColor: themeColor, color: "#FFFFFF" }}
						>
							{speciesDefinitions[animalType].subspecies.map((subspecies) => (
								<option key={subspecies.name} value={subspecies.name} style={{backgroundColor: '#FFFFFF', color: '#000000'}}>
									{subspecies.name}
								</option>
							))}
						</select>
					</div>

                    <div className="input-field">
                        <label className="block text-lg font-semibold mb-2">{speciesDefinitions[animalType].subspeciesName} per {houseName}</label>
                        <input
                            type="number"
                            value={numberOfAnimals}
                            onChange={(e) => setNumberOfAnimals(Number(e.target.value))}
                            className="p-2 border border-gray-300 rounded-md w-full"
                        />
                    </div>

                    <div className="input-field">
                        <label className="block text-lg font-semibold mb-2">{houseName}s</label>
                        <input
                            type="number"
                            value={houseCount}
                            onChange={(e) => setHouseCount(Number(e.target.value))}
                            className="p-2 border border-gray-300 rounded-md w-full"
                        />
                    </div>

                    <div className="input-field">
                        <label className="block text-lg font-semibold mb-2">Temperature (°F)</label>
                        <input
                            type="number"
                            value={temperature}
                            onChange={(e) => setTemperature(Number(e.target.value))}
                            className="p-2 border border-gray-300 rounded-md w-full"
                        />
                    </div>

                    <div className="input-field">
                        <label className="block text-lg font-semibold mb-2">Processing Age (Weeks)</label>
                        <input
                            type="number"
                            value={processingAge}
                            onChange={(e) => setProcessingAge(Number(e.target.value))}
                            className="p-2 border border-gray-300 rounded-md w-full"
                        />
                    </div>
                </div>

                <div className="grid grid-cols-1 gap-6 mt-4">
                    <div className="input-field">
                        <label className="block text-lg font-semibold mb-2">Duration (Weeks): {growthStage}</label>
                        <input
                            type="range"
                            min={adjustedGrowthStage(animalType).min}
                            max={extendGrowth ? 208 : adjustedGrowthStage(animalType).max}
                            value={growthStage}
                            onChange={(e) => setGrowthStage(Number(e.target.value))}
                            className="w-full"
                        />
                        <div className="checkbox-container mt-2">
                            <input
                                type="checkbox"
                                checked={extendGrowth}
                                onChange={(e) => setExtendGrowth(e.target.checked)}
                                className="mr-2"
                            />
                            <label>Expand to four years</label>
                        </div>
                    </div>
                </div>
                <ResponsiveContainer width="100%" height={400}>
                    <LineChart data={waterConsumptionData}>
                        <CartesianGrid strokeDasharray="3 3" />
                        <XAxis dataKey={timeKey} />
                        <YAxis label={{ value: 'Cumulative Gallons', angle: -90, position: 'insideLeft' }} />
                        <Tooltip content={<CustomTooltip />} />
                        <Line type="monotone" dataKey="cumulative" stroke={themeColor} strokeWidth={3} />
                    </LineChart>
                </ResponsiveContainer>
                <ResponsiveContainer width="100%" height={200}>
                    <BarChart data={waterConsumptionData}>
                        <CartesianGrid strokeDasharray="3 3" />
                        <XAxis dataKey={timeKey} />
                        <YAxis label={{ value: 'Daily Gallons', angle: -90, position: 'insideLeft' }} />
                        <Tooltip content={<CustomTooltip />} />
                        <Bar dataKey="consumption" fill={themeColor} />
                    </BarChart>
                </ResponsiveContainer>
                <div className="mt-6 text-right font-bold">
                    Total Water Consumption: {Math.round(totalWater).toLocaleString()} Gallons
                </div>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WaterConsumptionCalculator />);

</script>
<!-- Your collapsible references section can remain as is -->
</body>
</html>
